<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Videos · Mi Navi</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0B4F">
<link rel="icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="navi.css?v=20261029g">
<link rel="stylesheet" href="suite.css?v=20261029g">
<script src="auth.js?v=20261029g"></script>
<script>if (!NaviAuth.current()) location.replace('login.html?next=videos.html');</script>
<style>
.chans{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.chan{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;padding:22px;border-radius:var(--radius);background:var(--navy-2);border:1px solid #ffffff18;transition:transform .25s cubic-bezier(.3,1.6,.5,1),border-color .2s;animation:rise .5s cubic-bezier(.2,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
.chan:hover{transform:translateY(-4px);border-color:var(--lime)}
.chan .av{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;color:var(--ink);grid-row:span 2;box-shadow:0 6px 0 #0003}
.chan b{font-family:var(--display);font-size:22px}
.chan p{color:var(--muted);font-size:14px}
.chan .btn{grid-column:1/-1;margin-top:12px;background:#FF0033;color:#fff;box-shadow:0 6px 0 #A30021}
.vids{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.vcard{display:block;border-radius:20px;overflow:hidden;background:var(--navy-2);border:1px solid #ffffff18;transition:transform .25s}
.vcard:hover{transform:translateY(-4px)}
.vcard img{aspect-ratio:16/9;width:100%;object-fit:cover}
.vcard b{display:block;padding:12px 14px 2px}
.vcard small{display:block;padding:0 14px 14px;color:var(--muted)}
@media (max-width:760px){.chans,.vids{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html"><img src="assets/navi-logo.png" alt="Navi"><small>MÓVIL</small></a>
    <a class="btn btn-ghost sm back" href="cuenta.html">← <span>Mi Navi</span></a>
  </div>
</header>

<main class="wrap">
  <div class="title">
    <div class="ico" style="background:#FF9A6B">▶️</div>
    <div><h1>Videos</h1><p>Canales NAVI y contenido para toda la familia. Gratis para clientes Navi.</p></div>
  </div>

  <label class="search"><span aria-hidden="true">🔍</span><input id="q" placeholder="Buscar videos y canales" aria-label="Buscar videos y canales"></label>

  <div class="blk-h"><h2>Canales</h2><span id="ccount"></span></div>
  <div class="chans" id="chans"></div>

  <div class="blk-h"><h2>Videos destacados</h2><span id="vcount"></span></div>
  <div class="vids" id="vids"></div>
</main>

<script src="catalog.js?v=20261029g"></script>
<script>
const $ = id => document.getElementById(id);
const ini = n => n.replace(/[^A-Za-zÁÉÍÓÚÑ ]/g, '').split(' ').filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const render = () => {
  const q = $('q').value.trim().toLowerCase();
  const chans = NAVI_CHANNELS.filter(c => !q || (c.name + ' ' + c.desc).toLowerCase().includes(q));
  $('ccount').textContent = `${chans.length} ${chans.length === 1 ? 'canal' : 'canales'}`;
  $('chans').innerHTML = chans.length ? chans.map((c, i) => `<article class="chan" style="animation-delay:${i * .06}s">
      <span class="av" style="background:${c.color}">${ini(c.name)}</span><b>${c.name}</b><p>${c.desc}</p>
      <a class="btn" href="${c.url}" target="_blank" rel="noopener">▶ Ver canal</a></article>`).join('')
    : '<div class="empty">No hay canales con esa búsqueda.</div>';
  const vids = NAVI_VIDEOS.filter(v => !q || (v.title + ' ' + v.channel).toLowerCase().includes(q));
  $('vcount').textContent = vids.length ? `${vids.length} videos` : '';
  $('vids').innerHTML = vids.length ? vids.map(v => `<a class="vcard" href="https://www.youtube.com/watch?v=${v.yt}" target="_blank" rel="noopener">
      <img src="https://i.ytimg.com/vi/${v.yt}/hqdefault.jpg" alt="" loading="lazy"><b>${v.title}</b><small>${v.channel}</small></a>`).join('')
    : '<div class="empty" style="grid-column:1/-1">Muy pronto, videos destacados de nuestros canales.</div>';
};
$('q').addEventListener('input', render);
render();
</script>
</body>
</html>
