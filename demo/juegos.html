<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Juegos · Mi Navi</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0B4F">
<link rel="icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="navi.css?v=20261030d">
<link rel="stylesheet" href="suite.css?v=20261030d">
<script src="auth.js?v=20261030d"></script>
<script>if (!NaviAuth.current()) location.replace('login.html?next=juegos.html');</script>
<style>
.hero{position:relative;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:28px;border-radius:var(--radius);background:linear-gradient(120deg,#7B5CFA,#4B2FD6);overflow:hidden;margin-bottom:26px;box-shadow:10px 10px 0 var(--lime)}
.hero .tag{display:inline-block;background:var(--lime);color:var(--ink);font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;margin-bottom:10px}
.hero h2{font-size:clamp(28px,4vw,40px);margin-bottom:6px}
.hero p{color:#ECE8FF;max-width:460px;margin-bottom:18px}
.hero img{width:130px;height:130px;border-radius:30px;transform:rotate(6deg);box-shadow:0 14px 30px #0006;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:rotate(2deg) translateY(-8px)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.game{display:grid;grid-template-columns:72px 1fr;gap:6px 14px;padding:16px;border-radius:24px;background:var(--navy-2);border:1px solid #ffffff18;transition:transform .25s cubic-bezier(.3,1.6,.5,1),border-color .2s;animation:rise .5s cubic-bezier(.2,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
.game:hover{transform:translateY(-4px);border-color:var(--lime)}
.game img{width:72px;height:72px;border-radius:18px;grid-row:span 2;object-fit:cover}
.game .cat{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
.game b{display:block;font-family:var(--display);font-size:19px;line-height:1.15}
.game p{font-size:13px;color:var(--muted);grid-column:1/-1;margin:4px 0 6px}
.game .badges{grid-column:1/-1}
.game .btn{grid-column:1/-1;margin-top:10px}
.max{border-radius:var(--radius);padding:22px;background:linear-gradient(135deg,#2A1B3D,#14102A);border:2px solid #FFC23A66}
.max .game{background:#ffffff0d;border-color:#FFC23A44}
.max .game .cat{color:#FFC23A}
.max .btn{background:#FFC23A;color:var(--ink);box-shadow:0 6px 0 #B5861A}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){
  .grid{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;padding:22px}
  .hero img{position:absolute;right:-14px;top:-10px;width:96px;height:96px;opacity:.9}
  .hero h2,.hero .tag{position:relative;max-width:70%}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html"><img src="assets/navi-logo.png" alt="Navi"><small>MÓVIL</small></a>
    <a class="btn btn-ghost sm back" href="cuenta.html">← <span>Mi Navi</span></a>
  </div>
</header>

<main class="wrap">
  <div class="title">
    <div class="ico" style="background:#A893FF">🎮</div>
    <div><h1>Juegos</h1><p>Se abren en el navegador, sin descargar nada. Gratis para clientes Navi.</p></div>
  </div>

  <section class="hero" id="hero"></section>

  <label class="search"><span aria-hidden="true">🔍</span><input id="q" placeholder="Buscar juegos" aria-label="Buscar juegos"></label>
  <div class="chips" id="chips"></div>

  <div class="blk-h"><h2>Todos los juegos</h2><span id="count"></span></div>
  <div class="grid" id="list"></div>

  <section id="maxSec">
    <div class="blk-h"><h2>⭐ Juegos premium</h2><span>Ilustrados, con más niveles y más reto</span></div>
    <div class="max"><div class="grid" id="maxList"></div></div>
  </section>
</main>

<script src="catalog.js?v=20261030d"></script>
<script>
const $ = id => document.getElementById(id);
const basic = NAVI_GAMES.filter(g => g.tier !== 'max'), premium = NAVI_GAMES.filter(g => g.tier === 'max');
const play = g => `<a class="btn btn-lime" href="${gameUrl(g)}" target="_blank" rel="noopener">Jugar ▶</a>`;
const card = (g, i) => `<article class="game" style="animation-delay:${i * .05}s">
  <img src="${g.icon}" alt=""><div><span class="cat">${g.cat}</span><b>${g.name}</b></div>
  <p>${g.desc}</p>
  <div class="badges">${g.badges.map(b => `<i class="${b === 'Nuevo' ? 'new' : g.tier === 'max' ? 'gold' : ''}">${b}</i>`).join('')}</div>
  ${play(g)}</article>`;

const f = basic.find(g => g.featured) || basic[0];
$('hero').innerHTML = `<div><span class="tag">Juego destacado</span><h2>${f.name}</h2><p>${f.desc}</p>${play(f)}</div><img src="${f.icon}" alt="">`;

let cat = 'Todos';
const cats = ['Todos', ...new Set(basic.map(g => g.cat))];
const render = () => {
  const q = $('q').value.trim().toLowerCase();
  const match = g => !q || (g.name + ' ' + g.desc + ' ' + g.cat).toLowerCase().includes(q);
  $('chips').innerHTML = cats.map(c => `<button data-c="${c}" aria-pressed="${c === cat}">${c}</button>`).join('');
  const items = basic.filter(g => (cat === 'Todos' || g.cat === cat) && match(g));
  $('count').textContent = `${items.length} ${items.length === 1 ? 'juego' : 'juegos'}`;
  $('list').innerHTML = items.length ? items.map(card).join('') : `<div class="empty">No encontramos juegos con "${q}".</div>`;
  const mx = premium.filter(match);
  $('maxSec').hidden = !mx.length;
  $('maxList').innerHTML = mx.map(card).join('');
  $('hero').hidden = !!q;
};
$('chips').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) { cat = b.dataset.c; render(); } });
$('q').addEventListener('input', render);
render();
</script>
</body>
</html>
