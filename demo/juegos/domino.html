<!doctype html>
<html lang="es">
<head>
<script>/* Navi Movil: solo clientes con sesion en Mi Navi */try{if(!JSON.parse(localStorage.getItem('navi.session')))throw 0}catch(e){location.replace('../login.html?next=juegos/domino.html')}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E0F2E">
<meta name="apple-mobile-web-app-title" content="Navi Juegos">
<link rel="icon" href="../assets/icon-180.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<title>Dominó NAVI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#0E0F2E; --panel:#181A45; --line:#2A2C66; --rosa:#E4007C; --cian:#2FD3E8; --oro:#FFC23A;
  --ok:#2BD67B; --fg:#F3F1FF; --muted:#9C9BD0; --paper:#FFF4E0; --ink:#2A1B3D;
  --display:"Bungee","Impact",system-ui,sans-serif; --body:"Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-family:var(--display);font-size:1.1rem}
.brand b{color:var(--rosa);font-weight:400}
.hbtns{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 .78rem var(--body);background:var(--panel);border:1px solid var(--cian);border-radius:999px;padding:4px 11px 4px 4px}
.pill i{width:22px;height:22px;border-radius:50%;background:var(--cian);color:var(--bg);font:800 .85rem var(--body);font-style:normal;display:grid;place-items:center}
/* jugadores */
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seat{background:var(--panel);border-radius:14px;padding:8px 6px;text-align:center;border:2px solid transparent;min-width:0;position:relative}
.seat.turn{border-color:var(--oro)}
.seat img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:var(--paper);display:block;margin:0 auto 4px}
.seat b{display:block;font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .sc{font:400 .95rem var(--display);color:var(--oro)}
.seat .n{font-size:.66rem;color:var(--muted)}
.seat .say{position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:var(--paper);color:var(--ink);font-size:.62rem;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap;animation:say .25s cubic-bezier(.3,1.6,.5,1)}
@keyframes say{from{transform:translateX(-50%) scale(.5)}}
/* mesa */
.table{background:radial-gradient(circle at 50% 40%,#1f6b46,#13472f);border-radius:22px;min-height:240px;padding:14px 10px;position:relative;box-shadow:inset 0 0 0 4px #0003}
.ends{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;color:#ffffffc0;margin-bottom:8px}
.ends span{background:#0004;padding:3px 9px;border-radius:99px}
.chain{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:center}
.status{text-align:center;font-weight:700;font-size:.9rem;min-height:1.3em}
/* fichas */
.tile{display:inline-flex;background:var(--paper);border-radius:6px;box-shadow:0 2px 0 #0005, inset 0 0 0 1px #0002;flex:none}
.tile .h{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:3px;gap:1px}
.tile .h i{border-radius:50%}
.tile .h i.d{background:var(--ink)}
.tile.sm{flex-direction:row}.tile.sm .h{width:22px;height:22px}.tile.sm .h + .h{border-left:1px solid #0003}
.tile.sm.v{flex-direction:column}.tile.sm.v .h + .h{border-left:0;border-top:1px solid #0003}
.tile.new{animation:drop .35s cubic-bezier(.3,1.6,.5,1);box-shadow:0 0 0 3px var(--oro)}
@keyframes drop{from{transform:scale(1.5);opacity:0}}
.hand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:62px}
.tile.big{flex-direction:column;cursor:pointer;border:0;padding:0;transition:transform .15s}
.tile.big .h{width:30px;height:30px}.tile.big .h + .h{border-top:1px solid #0003}
.tile.big.can{box-shadow:0 0 0 3px var(--ok),0 3px 0 #0006;transform:translateY(-4px)}
.tile.big:disabled{opacity:.45;cursor:default}
.handlbl{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-weight:700}
.sidepick{display:flex;gap:8px;justify-content:center}
.sidepick button{border:0;border-radius:12px;padding:10px 14px;background:var(--oro);color:var(--ink);font-weight:800}
/* pantallas */
.ov{position:fixed;inset:0;z-index:20;background:#0E0F2Ee8;display:grid;place-items:center;padding:20px}
.card{width:min(420px,100%);background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:24px 22px;text-align:center}
.card .logo{font-family:var(--display);font-size:1.9rem;line-height:1}
.card .logo b{color:var(--rosa);font-weight:400}
.card p{color:#d7d5f5;font-size:.92rem;line-height:1.45}
.card ol{text-align:left;font-size:.88rem;line-height:1.5;padding-left:20px;color:#d7d5f5}
.rank{display:grid;gap:6px;margin:12px 0;text-align:left}
.rank div{display:flex;justify-content:space-between;background:var(--bg);border-radius:12px;padding:9px 14px;font-weight:700}
.rank div.me{outline:2px solid var(--oro)}
.big2{display:block;width:100%;border:0;border-radius:14px;padding:14px;background:var(--rosa);color:#fff;font:400 1.05rem var(--display);box-shadow:0 5px 0 #8E004D;margin-top:14px}
.ghost{display:block;width:100%;margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:11px;background:none;color:var(--fg);font-weight:600;text-decoration:none;text-align:center}
@media (max-width:380px){.tile.big .h{width:25px;height:25px}.tile.sm .h{width:19px;height:19px}}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="brand">Dominó <b>NAVI</b></div>
    <div class="hbtns"><button class="pill" id="homeBtn"><i>⌂</i>Inicio</button><button class="pill" id="helpBtn"><i>?</i>Instrucciones</button></div>
  </div>
  <div class="seats" id="seats"></div>
  <div class="table">
    <div class="ends"><span id="endL">◀</span><span id="pile">Mano 1 · a 100</span><span id="endR">▶</span></div>
    <div class="chain" id="chain"></div>
  </div>
  <div class="status" id="status"></div>
  <div class="sidepick" id="side" hidden><button data-s="L">◀ Poner a la izquierda</button><button data-s="R">A la derecha ▶</button></div>
  <div class="handlbl"><span>Tus fichas</span><span id="handPts"></span></div>
  <div class="hand" id="hand"></div>
  <a class="ghost" href="../juegos.html">← Volver a Juegos</a>
</div>
<div class="ov" id="ov"><div class="card" id="ovCard"></div></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const PLAYERS = [{ name: 'Tú', img: 'sofi' }, { name: 'Tía Rosa', img: 'mama' }, { name: 'Primo Beto', img: 'beto' }, { name: 'Abuela Chayo', img: 'chayo' }];
const GOAL = 100, KEY = 'navi_domino';
const stats = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { wins: 0, played: 0 }; } catch { return { wins: 0, played: 0 }; } };
// tu foto o personaje de Mi Navi en tu lugar de la mesa
try { const s = JSON.parse(localStorage.getItem('navi.session')); const ph = JSON.parse(localStorage.getItem('navi.photos') || '{}')[s.phone]; if (ph) PLAYERS[0].photo = ph; } catch {}

const PIPS = { 0: [], 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const half = n => `<div class="h">${Array.from({ length: 9 }, (_, i) => `<i class="${PIPS[n].includes(i) ? 'd' : ''}"></i>`).join('')}</div>`;
const tileSm = (t, isNew) => `<div class="tile sm${t[0] === t[1] ? ' v' : ''}${isNew ? ' new' : ''}">${half(t[0])}${half(t[1])}</div>`;
const pts = h => h.reduce((s, t) => s + t[0] + t[1], 0);

let hands, chain, turn, passes, scores, round, starter, waiting = null, says = [], lastPlaced = -1, busy = false;
let ac = null;
const beep = (f, d = .08, type = 'triangle', v = .05) => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.value = v; o.connect(g).connect(ac.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d); o.stop(ac.currentTime + d); } catch {} };
const clack = () => { beep(180, .05, 'square', .06); setTimeout(() => beep(260, .04, 'square', .04), 40); };

const ends = () => chain.length ? [chain[0][0], chain[chain.length - 1][1]] : null;
const sides = t => { const e = ends(); if (!e) return ['R']; const s = []; if (t.includes(e[0])) s.push('L'); if (t.includes(e[1]) && (s.length === 0 || e[0] !== e[1] || t[0] !== t[1])) s.push('R'); if (e[0] === e[1] && s.length === 2) s.pop(); return s; };
const playable = (p, t) => { if (!chain.length && round === 1 && turn === starter && hands[p].some(x => x[0] === 6 && x[1] === 6)) return t[0] === 6 && t[1] === 6; return sides(t).length > 0; };

function place(p, t, side) {
  hands[p] = hands[p].filter(x => x !== t);
  if (!chain.length) { chain.push([t[0], t[1]]); lastPlaced = 0; }
  else if (side === 'L') { const e = chain[0][0]; chain.unshift(t[1] === e ? [t[0], t[1]] : [t[1], t[0]]); lastPlaced = 0; }
  else { const e = chain[chain.length - 1][1]; chain.push(t[0] === e ? [t[0], t[1]] : [t[1], t[0]]); lastPlaced = chain.length - 1; }
  passes = 0; says[p] = `${t[0]}|${t[1]}`; clack();
}
function paint() {
  $('seats').innerHTML = PLAYERS.map((pl, i) => `<div class="seat${i === turn ? ' turn' : ''}">${says[i] ? `<span class="say">${says[i]}</span>` : ''}
    <img src="${pl.photo || `../assets/${pl.img}.png`}" alt=""><b>${pl.name}</b><div class="sc">${scores[i]}</div><div class="n">${hands[i].length} fichas</div></div>`).join('');
  $('chain').innerHTML = chain.length ? chain.map((t, i) => tileSm(t, i === lastPlaced)).join('') : '<p style="color:#ffffffa0;font-size:.85rem;margin:40px 0">La mesa está vacía</p>';
  const e = ends(); $('endL').textContent = e ? `◀ ${e[0]}` : '◀'; $('endR').textContent = e ? `${e[1]} ▶` : '▶';
  $('pile').textContent = `Mano ${round} · a ${GOAL}`;
  const mine = turn === 0 && !busy;
  $('hand').innerHTML = hands[0].map((t, i) => { const ok = mine && playable(0, t); return `<button class="tile big${ok ? ' can' : ''}" data-i="${i}" ${ok ? '' : 'disabled'} aria-label="Ficha ${t[0]} ${t[1]}">${half(t[0])}${half(t[1])}</button>`; }).join('');
  $('handPts').textContent = `${hands[0].length} fichas · ${pts(hands[0])} puntos`;
}
const status = t => $('status').textContent = t;

function next() {
  if (!hands[turn].length) return endRound(turn, 'domino');
  if (passes >= 4) return endRound(null, 'tranque');
  turn = (turn + 1) % 4; play();
}
function play() {
  paint();
  const can = hands[turn].filter(t => playable(turn, t));
  if (turn === 0) {
    if (!can.length) { busy = true; status('No tienes ficha: pasas…'); says[0] = 'Paso'; passes++; paint(); return setTimeout(() => { busy = false; next(); }, 1100); }
    status(chain.length ? 'Tu turno: toca una ficha verde' : 'Abres tú: toca una ficha');
    return;
  }
  busy = true; status(`${PLAYERS[turn].name} está pensando…`); paint();
  setTimeout(() => {
    // la computadora juega su ficha más pesada (las mulas primero)
    if (!can.length) { says[turn] = 'Paso'; passes++; status(`${PLAYERS[turn].name} pasa`); beep(200, .1); }
    else {
      const t = can.sort((a, b) => (b[0] + b[1] + (b[0] === b[1] ? 3 : 0)) - (a[0] + a[1] + (a[0] === a[1] ? 3 : 0)))[0];
      const s = sides(t);
      // si cabe en los dos lados, deja la punta que más le conviene (la que más tiene en su mano)
      let side = s[0];
      if (s.length > 1) { const e = ends(), rest = hands[turn].filter(x => x !== t), keep = v => rest.filter(x => x.includes(v)).length; const other = (end, tt) => tt[0] === end ? tt[1] : tt[0]; side = keep(other(e[0], t)) >= keep(other(e[1], t)) ? 'L' : 'R'; }
      place(turn, t, side); status(`${PLAYERS[turn].name} puso ${t[0]}|${t[1]}`);
    }
    busy = false; next();
  }, 850 + Math.random() * 400);
}
$('hand').addEventListener('click', e => {
  const b = e.target.closest('[data-i]'); if (!b || turn !== 0 || busy) return;
  const t = hands[0][+b.dataset.i];
  if (!playable(0, t)) return;
  const s = sides(t);
  if (s.length === 1 || !chain.length) { place(0, t, s[0]); $('side').hidden = true; return next(); }
  waiting = t; $('side').hidden = false; status('¿De qué lado la pones?');
  document.querySelectorAll('.tile.big').forEach(x => x.style.outline = x === b ? '3px solid var(--oro)' : '');
});
$('side').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b || !waiting) return; $('side').hidden = true; const t = waiting; waiting = null; place(0, t, b.dataset.s); next(); });

function deal() {
  const all = []; for (let a = 0; a <= 6; a++) for (let b = a; b <= 6; b++) all.push([a, b]);
  for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  hands = [0, 1, 2, 3].map(k => all.slice(k * 7, k * 7 + 7).sort((x, y) => (x[0] + x[1]) - (y[0] + y[1])));
  chain = []; passes = 0; says = []; lastPlaced = -1; waiting = null; $('side').hidden = true;
  // la primera mano abre quien tenga la mula de seis; después abre quien ganó
  if (round === 1) starter = hands.findIndex(h => h.some(t => t[0] === 6 && t[1] === 6));
  turn = starter;
  status(round === 1 ? `${PLAYERS[starter].name} tiene la mula de seis y abre` : `${PLAYERS[starter].name} abre la mano`);
  setTimeout(play, 700); paint();
}
function endRound(w, how) {
  busy = true; paint();
  // dominó: gana quien se quedó sin fichas; tranque: gana quien tenga menos puntos en la mano
  if (how === 'tranque') { const s = hands.map(pts); w = s.indexOf(Math.min(...s)); }
  const gain = hands.reduce((s, h, i) => s + (i === w ? 0 : pts(h)), 0);
  scores[w] += gain; starter = w;
  [523, 659, 784].forEach((f, k) => setTimeout(() => beep(f, .14), k * 90));
  const champ = scores.findIndex(s => s >= GOAL);
  const table = `<div class="rank">${PLAYERS.map((p, i) => ({ p, i, s: scores[i] })).sort((a, b) => b.s - a.s).map(o => `<div class="${o.i === 0 ? 'me' : ''}"><span>${o.p.name}</span><span>${o.s}</span></div>`).join('')}</div>`;
  if (champ >= 0) {
    const st = stats(); st.played++; if (champ === 0) st.wins++; try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {}
    return show(`<div class="logo">${champ === 0 ? '¡Ganaste la partida!' : `Ganó ${PLAYERS[champ].name}`}</div>${table}<p>Partidas ganadas: <b>${st.wins} de ${st.played}</b>.</p><button class="big2" id="go">Nueva partida</button><a class="ghost" href="../juegos.html">Volver a Juegos</a>`, newMatch);
  }
  show(`<div class="logo">${how === 'domino' ? '¡Dominó!' : '¡Tranque!'}</div><p>${how === 'domino' ? `${PLAYERS[w].name} se quedó sin fichas` : `Nadie pudo jugar. ${PLAYERS[w].name} tenía menos puntos en la mano`} y se lleva <b>${gain} puntos</b>.</p>${table}<button class="big2" id="go">Siguiente mano</button>`, () => { $('ov').hidden = true; round++; busy = false; deal(); });
}
function newMatch() { $('ov').hidden = true; scores = [0, 0, 0, 0]; round = 1; busy = false; deal(); }
function show(html, onGo) { $('ovCard').innerHTML = html; $('ov').hidden = false; $('go').onclick = onGo; }
function intro() {
  scores = [0, 0, 0, 0]; round = 1; hands = [[], [], [], []]; chain = []; turn = -1; busy = true; says = []; paint(); status('');
  const st = stats();
  show(`<div class="logo">Dominó <b>NAVI</b></div><p>Una partida con la familia, como en la sobremesa del domingo.</p>
    <ol><li>Cada quien recibe 7 fichas. Abre quien tenga la mula de seis.</li><li>En tu turno toca una ficha verde: debe coincidir con una de las puntas de la mesa. Si no tienes, pasas.</li><li>Gana la mano quien se queda sin fichas (<b>¡Dominó!</b>) o, si se cierra el juego, quien tenga menos puntos (<b>tranque</b>).</li><li>El ganador suma los puntos de las fichas de los demás. La partida es a ${GOAL}.</li></ol>
    ${st.played ? `<p>Llevas ${st.wins} de ${st.played} partidas ganadas.</p>` : ''}<button class="big2" id="go">¡A jugar!</button><a class="ghost" href="../juegos.html">Salir a Juegos</a>`, newMatch);
}
$('homeBtn').onclick = intro;
$('helpBtn').onclick = () => {
  if (!$('ov').hidden) return; // las instrucciones ya vienen en la pantalla abierta
  show(`<div class="logo" style="font-size:1.4rem">¿Cómo se juega?</div><ol style="margin-top:14px"><li>Las fichas con borde verde son las que puedes jugar.</li><li>Si una ficha cabe en las dos puntas, te preguntamos de qué lado ponerla.</li><li>Las mulas (dobles) se ponen de pie en la mesa.</li><li>Los rivales juegan solos; arriba ves quién pasó y qué ficha puso cada quien.</li></ol><button class="big2" id="go">Entendido</button>`,
    () => { $('ov').hidden = true; });
};
intro();
})();
</script>
</body>
</html>
