<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Navi SOS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a0710">
<link rel="icon" href="sos-192.png">
<link rel="apple-touch-icon" href="sos-192.png">
<meta name="apple-mobile-web-app-title" content="Navi SOS">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../navi.css?v=20261030d">
<style>
:root{--sos:#FF5A5F}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 42%,#3a0d1c 0,#1a0710 60%);min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));user-select:none;-webkit-user-select:none}
.who{font-size:14px;color:#ffd1d6;margin-bottom:6px}
.who b{color:#fff}
.btn-sos{position:relative;width:min(300px,76vw);aspect-ratio:1;border-radius:50%;background:var(--sos);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 18px #FF5A5F2e,0 0 0 38px #FF5A5F14,0 20px 50px #0008;touch-action:manipulation;transition:transform .15s;margin:34px 0 30px}
.btn-sos:active{transform:scale(.95)}
.btn-sos b{font-family:var(--display);font-size:clamp(64px,20vw,96px);line-height:1}
.btn-sos small{display:block;font-size:13px;font-weight:800;letter-spacing:.14em;margin-top:6px}
.btn-sos::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:3px solid var(--sos);animation:ring 2.2s ease-out infinite}
@keyframes ring{to{transform:scale(1.25);opacity:0}}
.hint{color:#ffd1d6;font-size:15px;max-width:340px}
.fam{display:flex;justify-content:center;margin-top:16px}
.fam img,.fam span{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:#fff;border:3px solid #1a0710;margin:0 -5px}
.fam span{display:grid;place-items:center;background:#A893FF;color:#fff;font-weight:800}
/* cuenta regresiva y alerta enviada */
.ov{position:fixed;inset:0;z-index:10;background:#2a0710f7;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));text-align:center}
.ov[hidden]{display:none}
.big{font-family:var(--display);font-weight:800;font-size:140px;line-height:1;color:#fff;animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.ov h1{font-size:28px;margin:10px 0 6px}
.ov p{color:#ffd1d6}
.list{display:grid;gap:8px;margin:18px auto;width:min(360px,100%);text-align:left}
.list div{display:flex;align-items:center;gap:10px;background:#ffffff12;border-radius:14px;padding:10px 12px;font-size:15px}
.list img,.list span.i{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:#fff;flex:none}
.list span.i{display:grid;place-items:center;background:#A893FF;color:#fff;font-weight:800}
.list em{margin-left:auto;font-style:normal;font-size:12px;font-weight:800;color:var(--lime)}
.ov .btn{min-width:240px;justify-content:center;margin-top:10px}
.cancel{background:#fff;color:#2a0710;font-size:18px;padding:16px 28px}
.call{background:#fff;color:#c0262c}
.lock{max-width:360px}
.lock h1{font-size:26px;margin:14px 0 8px}
.lock p{color:#ffd1d6;margin-bottom:18px}
.install{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(420px,calc(100% - 32px));background:#ffffff12;border:1px solid #ffffff26;border-radius:18px;padding:12px 14px;font-size:13px;color:#ffd1d6;text-align:left;display:flex;gap:12px;align-items:center}
.install[hidden]{display:none}
.install img{width:40px;height:40px;border-radius:10px;flex:none}
.install button{margin-left:auto;flex:none;background:#fff;color:#2a0710;border-radius:99px;padding:8px 14px;font-weight:800;font-size:13px}
/* barra de arriba: regresar a NAVI SOS y cómo poner el botón en la pantalla */
body{padding-top:calc(76px + env(safe-area-inset-top,0px))}
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px))}
.bar a,.bar button{display:inline-flex;align-items:center;gap:6px;background:#ffffff14;border:1px solid #ffffff26;color:#fff;border-radius:99px;padding:9px 14px;font-weight:700;font-size:14px;text-decoration:none}
.bar button{background:#fff;color:#2a0710;border:0}
.sheet{position:fixed;inset:0;z-index:20;background:#0009;display:grid;place-items:end center;padding:12px}
.sheet[hidden]{display:none}
.sheet > div{width:min(460px,100%);background:#2a0d18;border:1px solid #ffffff26;border-radius:24px;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));text-align:left;max-height:calc(100dvh - 24px);overflow:auto}
.sheet h2{font-size:22px;margin-bottom:6px}
.sheet p{color:#ffd1d6;font-size:14px}
.sheet ol{margin:14px 0 4px;padding-left:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.sheet li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:15px}
.sheet li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--sos);display:grid;place-items:center;font-weight:800}
.sheet .ico{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:#ffffff1f;vertical-align:middle;margin:0 2px}
.sheet .url{display:flex;gap:8px;margin-top:12px}
.sheet .url input{flex:1;min-width:0;background:#ffffff12;border:1px solid #ffffff2a;border-radius:12px;padding:10px;color:#fff;font-size:13px}
.sheet .url button,.sheet .main{background:#fff;color:#2a0710;border-radius:12px;padding:10px 14px;font-weight:800}
.sheet .main{width:100%;margin-top:16px;border-radius:99px;padding:13px;font-size:15px}
.sheet .tabs{display:flex;gap:6px;margin-top:14px}
.sheet .tabs button{flex:1;padding:8px;border-radius:99px;border:1px solid #ffffff2a;color:#ffd1d6;font-weight:700;font-size:13px}
.sheet .tabs button[aria-pressed="true"]{background:#fff;color:#2a0710}
</style>
</head>
<body>
<div class="bar" id="bar"><a href="../sos.html" id="backSos">← NAVI SOS</a><button id="howBtn">📲 Ponlo en tu pantalla</button></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shTitle"></div>
<main id="app"></main>
<div class="ov" id="ov" hidden role="alertdialog" aria-modal="true" aria-labelledby="ovTitle"></div>
<div class="install" id="install" hidden><img src="sos-192.png" alt=""><span id="installTxt"></span><button id="installBtn" hidden>Agregar</button></div>

<script src="../auth.js?v=20261103a"></script>
<script>
const $ = id => document.getElementById(id);
// sin sesión abierta (p. ej. se cerró sola por inactividad) el botón sigue listo en este celular: solo manda la alerta
const user = NaviAuth.current() || (() => { try { const p = localStorage.getItem('navi.sos.device'); return p ? NaviAuth.find(p) : null; } catch { return null; } })();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const face = (m, cls = '') => m.img ? `<img class="${cls}" src="../assets/${m.img}.png" alt="">` : `<span class="${cls || 'i'}">${esc(m.name[0].toUpperCase())}</span>`;

if (!user) {
  $('app').innerHTML = `<div class="lock"><div style="font-size:56px">🔐</div><h1>Inicia sesión una vez</h1><p>Entra a Mi Navi en este celular y el botón SOS queda listo para usarse sin volver a entrar.</p><a class="btn btn-lime" href="../login.html">Entrar a Mi Navi</a></div>`;
} else if (!user.apps.includes('sos')) {
  $('app').innerHTML = `<div class="lock"><div style="font-size:56px">🚨</div><h1>Botón SOS</h1><p>Viene incluido en los planes de 12 GB, 24 GB y el Plan Familia, con NAVI SOS Family.</p><a class="btn btn-lime" href="../index.html#plan">Ver Plan Familia</a></div>`;
} else {
  // la red familiar es la misma de NAVI SOS Family: las líneas del plan y las personas invitadas
  const KEY = 'navi.sos.' + user.owner;
  let S; try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { S = {}; }
  // se vuelve a leer antes de escribir para no pisar lo que la familia cambió mientras tanto
  const reload = () => { try { S = JSON.parse(localStorage.getItem(KEY)) || S; } catch {} };
  const lines = accountLines(user);
  // quien entró es "me"; la alerta va a los demás integrantes de su red familiar
  const me = lines.find(l => l.phone === user.phone) || lines[0];
  const family = [...lines.filter(l => l !== me), ...(S.extra || []).map(x => ({ name: x.name, phone: x.phone, img: null, invited: !x.verified }))];
  // en vivo: quién ya vio la alerta y quién va para allá (lo contestan desde NAVI SOS Family)
  const famState = m => m.invited ? 'SMS con mapa' : S.sos?.going?.[m.phone] ? '🚗 Va para allá' : S.sos?.seen?.[m.phone] ? '👀 Ya la vio' : '🔔 Alarma sonando';
  const famList = () => family.map(m => `<div>${face(m, m.img ? '' : 'i')}<span>${esc(m.name)}</span><em>${famState(m)}</em></div>`).join('');
  addEventListener('storage', e => { if (e.key !== KEY) return; reload(); const l = document.querySelector('#ov .list'); if (l && S.sos?.active) l.innerHTML = famList(); });

  $('app').innerHTML = `<div class="who">${esc(me.name)} · red de <b>${esc(lines.length > 1 ? user.familyName : me.name)}</b></div>
    <button class="btn-sos" id="sos" aria-label="Enviar alerta SOS a mi familia"><div><b>SOS</b><small>TOCA PARA PEDIR AYUDA</small></div></button>
    <p class="hint">${family.length ? 'Tu familia recibe la alerta con tu ubicación. Tienes 5 segundos para cancelar.' : 'Aún no hay nadie en tu red. Agrégalos desde NAVI SOS Family verificando su número.'}</p>
    ${family.length ? `<div class="fam">${family.map(m => face(m)).join('')}</div>` : ''}`;

  const ov = $('ov');
  let timer = null, pos = null;
  const where = () => pos ? `<a href="https://maps.google.com/?q=${pos.lat},${pos.lng}" target="_blank" rel="noopener" style="text-decoration:underline">tu ubicación actual</a>` : 'tu última ubicación conocida';

  function start() {
    if (!family.length) return;
    let n = 5;
    // pide la ubicación mientras corre la cuenta regresiva
    navigator.geolocation?.getCurrentPosition(p => { pos = { lat: p.coords.latitude.toFixed(5), lng: p.coords.longitude.toFixed(5) }; }, () => {}, { enableHighAccuracy: true, timeout: 5000 });
    navigator.vibrate?.(200);
    const draw = () => ov.innerHTML = `<div><div class="big">${n}</div><h1 id="ovTitle">Avisando a tu familia</h1><p>${family.length} ${family.length === 1 ? 'persona recibirá' : 'personas recibirán'} tu alerta con tu ubicación.</p><button class="btn cancel" id="cancel">Cancelar</button></div>`;
    ov.hidden = false; draw(); $('cancel').focus();
    timer = setInterval(() => { n--; navigator.vibrate?.(80); if (n > 0) draw(); else { clearInterval(timer); sent(); } }, 1000);
  }
  function sent() {
    navigator.vibrate?.([300, 120, 300]);
    const t = Date.now(), hh = new Date(t).toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' });
    // queda en la actividad de NAVI SOS Family y hace sonar la alarma en los demás integrantes (S.sos)
    reload();
    S.sos = { id: t, phone: me.phone, name: me.name, t, where: pos ? 'Ubicación actual enviada desde el botón SOS' : 'Última ubicación conocida (botón SOS)', active: true, seen: {}, going: {} };
    S.events = [...(S.events || []), { t, txt: `🚨 <b>${esc(me.name)}</b> activó SOS desde el botón` }];
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
    ov.innerHTML = `<div><div class="big" style="font-size:84px">🚨</div><h1 id="ovTitle">Tu familia ya está avisada</h1><p>${hh} · enviamos ${where()}</p>
      <div class="list">${famList()}</div>
      <p style="font-size:12px;margin-bottom:8px">Demostración: no se envían mensajes reales.</p>
      <a class="btn call" href="tel:911">📞 Llamar al 911</a><br><button class="btn btn-lime" id="ok">Estoy bien, terminar alerta</button></div>`;
  }
  $('sos').onclick = start;
  ov.onclick = e => {
    if (e.target.id === 'cancel') { clearInterval(timer); ov.hidden = true; }
    if (e.target.id === 'ok') {
      reload();
      if (S.sos) S.sos = { ...S.sos, active: false, ended: Date.now() };
      S.events = [...(S.events || []), { t: Date.now(), txt: `✅ <b>${esc(me.name)}</b> terminó la alerta SOS: está bien` }];
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
      ov.hidden = true;
    }
  };
}

// ícono propio en la pantalla de inicio: se instala aparte de Navi, con instrucciones para iPhone y Android
(() => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /Android/.test(ua);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  // ?from=app: lo abrieron desde Mi Navi / NAVI SOS. Sin eso y en modo app, ya es el botón instalado en la pantalla.
  const fromApp = new URLSearchParams(location.search).has('from') || /\/demo\/(sos|cuenta)/.test(document.referrer);
  const isSosApp = standalone && !fromApp;
  if (isSosApp) { $('howBtn').hidden = true; $('backSos').textContent = '⚙ NAVI SOS'; }
  const link = new URL('./', location.href).href;
  let prompt = null, tab = ios ? 'ios' : 'android';
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); prompt = e; if ($('sheet').hidden === false) how(); if (!isSosApp && user) $('installBtn').hidden = false; });
  addEventListener('appinstalled', () => { $('install').hidden = true; $('sheet').hidden = true; });
  const copyBox = `<div class="url"><input readonly value="${link}" aria-label="Enlace del botón SOS"><button id="cp">Copiar</button></div>`;
  function how() {
    // dentro de una app ya instalada (Mi Navi) el celular no deja agregar otro ícono: hay que abrir el enlace en el navegador
    const inside = standalone && fromApp;
    const steps = inside ? `<p>Estás dentro de la app de Mi Navi, y desde aquí el celular no deja agregar otro ícono. Hazlo desde el navegador:</p>
        <ol><li>Copia el enlace del botón SOS.</li><li>Ábrelo en ${ios ? '<b>Safari</b>' : '<b>Chrome</b>'} (pégalo en la barra de direcciones).</li><li>${ios ? 'Toca <span class="ico">⬆</span> <b>Compartir</b> y luego <b>Agregar a inicio</b>.' : 'Toca <span class="ico">⋮</span> y luego <b>Agregar a la pantalla principal</b>.'}</li></ol>${copyBox}`
      : tab === 'ios' ? `<ol><li>Abre esta página en <b>Safari</b>${ios && /CriOS|FxiOS|EdgiOS/.test(ua) ? ' (copia el enlace y pégalo ahí)' : ''}.</li><li>Toca <span class="ico">⬆</span> <b>Compartir</b> en la barra de abajo.</li><li>Desliza y elige <b>Agregar a inicio</b> <span class="ico">＋</span>.</li><li>Toca <b>Agregar</b>. Listo: el botón SOS queda en tu pantalla.</li></ol>${copyBox}`
      : `<ol><li>Abre esta página en <b>Chrome</b>.</li><li>Toca <span class="ico">⋮</span> arriba a la derecha.</li><li>Elige <b>Agregar a la pantalla principal</b> o <b>Instalar app</b>.</li><li>Confirma con <b>Instalar</b>. Listo: el botón SOS queda en tu pantalla.</li></ol>${copyBox}${prompt ? '<button class="main" id="inst">Instalar el botón SOS ahora</button>' : ''}`;
    $('sheet').innerHTML = `<div><h2 id="shTitle">📲 Solo el botón SOS en tu pantalla</h2><p>Un ícono aparte de Mi Navi: lo tocas y tu familia queda avisada, sin entrar a ningún menú.</p>
      ${inside ? '' : `<div class="tabs"><button data-t="ios" aria-pressed="${tab === 'ios'}">iPhone</button><button data-t="android" aria-pressed="${tab === 'android'}">Android</button></div>`}
      ${steps.replace(/<li>/g, '<li><span>').replace(/<\/li>/g, '</span></li>')}<button class="main" id="shOk" style="background:#ffffff1f;color:#fff">Entendido</button></div>`;
    $('sheet').hidden = false;
    $('sheet').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; how(); });
    $('shOk').onclick = () => { $('sheet').hidden = true; };
    if ($('inst')) $('inst').onclick = async () => { prompt.prompt(); await prompt.userChoice; prompt = null; how(); };
    $('cp').onclick = async () => { try { await navigator.clipboard.writeText(link); $('cp').textContent = '✓ Copiado'; } catch { const i = $('sheet').querySelector('.url input'); i.select(); document.execCommand?.('copy'); $('cp').textContent = '✓ Copiado'; } };
  }
  $('sheet').onclick = e => { if (e.target === $('sheet')) $('sheet').hidden = true; };
  $('howBtn').onclick = how;
  if (isSosApp || !user) return;
  // recordatorio abajo, también en el celular y dentro de la app de Mi Navi
  $('installTxt').innerHTML = '📲 <b>Pon solo el botón SOS en tu pantalla</b> para usarlo de un toque.';
  $('installBtn').hidden = false; $('installBtn').textContent = '¿Cómo?';
  $('installBtn').onclick = how;
  $('install').hidden = false;
})();
</script>
</body>
</html>
