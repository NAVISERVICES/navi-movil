<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Navi SOS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a0710">
<link rel="icon" href="sos-192.png">
<link rel="apple-touch-icon" href="sos-192.png">
<meta name="apple-mobile-web-app-title" content="Navi SOS">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../navi.css?v=20261030c">
<style>
:root{--sos:#FF5A5F}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 42%,#3a0d1c 0,#1a0710 60%);min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));user-select:none;-webkit-user-select:none}
.who{font-size:14px;color:#ffd1d6;margin-bottom:6px}
.who b{color:#fff}
.btn-sos{position:relative;width:min(300px,76vw);aspect-ratio:1;border-radius:50%;background:var(--sos);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 18px #FF5A5F2e,0 0 0 38px #FF5A5F14,0 20px 50px #0008;touch-action:manipulation;transition:transform .15s;margin:34px 0 30px}
.btn-sos:active{transform:scale(.95)}
.btn-sos b{font-family:var(--display);font-size:clamp(64px,20vw,96px);line-height:1}
.btn-sos small{display:block;font-size:13px;font-weight:800;letter-spacing:.14em;margin-top:6px}
.btn-sos::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:3px solid var(--sos);animation:ring 2.2s ease-out infinite}
@keyframes ring{to{transform:scale(1.25);opacity:0}}
.hint{color:#ffd1d6;font-size:15px;max-width:340px}
.fam{display:flex;justify-content:center;margin-top:16px}
.fam img,.fam span{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:#fff;border:3px solid #1a0710;margin:0 -5px}
.fam span{display:grid;place-items:center;background:#A893FF;color:#fff;font-weight:800}
/* cuenta regresiva y alerta enviada */
.ov{position:fixed;inset:0;z-index:10;background:#2a0710f7;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));text-align:center}
.ov[hidden]{display:none}
.big{font-family:var(--display);font-weight:800;font-size:140px;line-height:1;color:#fff;animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.ov h1{font-size:28px;margin:10px 0 6px}
.ov p{color:#ffd1d6}
.list{display:grid;gap:8px;margin:18px auto;width:min(360px,100%);text-align:left}
.list div{display:flex;align-items:center;gap:10px;background:#ffffff12;border-radius:14px;padding:10px 12px;font-size:15px}
.list img,.list span.i{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:#fff;flex:none}
.list span.i{display:grid;place-items:center;background:#A893FF;color:#fff;font-weight:800}
.list em{margin-left:auto;font-style:normal;font-size:12px;font-weight:800;color:var(--lime)}
.ov .btn{min-width:240px;justify-content:center;margin-top:10px}
.cancel{background:#fff;color:#2a0710;font-size:18px;padding:16px 28px}
.call{background:#fff;color:#c0262c}
.lock{max-width:360px}
.lock h1{font-size:26px;margin:14px 0 8px}
.lock p{color:#ffd1d6;margin-bottom:18px}
.install{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(420px,calc(100% - 32px));background:#ffffff12;border:1px solid #ffffff26;border-radius:18px;padding:12px 14px;font-size:13px;color:#ffd1d6;text-align:left;display:flex;gap:12px;align-items:center}
.install[hidden]{display:none}
.install img{width:40px;height:40px;border-radius:10px;flex:none}
.install button{margin-left:auto;flex:none;background:#fff;color:#2a0710;border-radius:99px;padding:8px 14px;font-weight:800;font-size:13px}
</style>
</head>
<body>
<main id="app"></main>
<div class="ov" id="ov" hidden role="alertdialog" aria-modal="true" aria-labelledby="ovTitle"></div>
<div class="install" id="install" hidden><img src="sos-192.png" alt=""><span id="installTxt"></span><button id="installBtn" hidden>Agregar</button></div>

<script src="../auth.js?v=20261030c"></script>
<script>
const $ = id => document.getElementById(id);
const user = NaviAuth.current();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const face = (m, cls = '') => m.img ? `<img class="${cls}" src="../assets/${m.img}.png" alt="">` : `<span class="${cls || 'i'}">${esc(m.name[0].toUpperCase())}</span>`;

if (!user) {
  $('app').innerHTML = `<div class="lock"><div style="font-size:56px">🔐</div><h1>Inicia sesión una vez</h1><p>Entra a Mi Navi en este celular y el botón SOS queda listo para usarse sin volver a entrar.</p><a class="btn btn-lime" href="../login.html">Entrar a Mi Navi</a></div>`;
} else if (!user.apps.includes('sos')) {
  $('app').innerHTML = `<div class="lock"><div style="font-size:56px">🚨</div><h1>Botón SOS</h1><p>Viene incluido en el Plan Familia y en el plan de 24 GB, con NAVI SOS Family.</p><a class="btn btn-lime" href="../index.html#plan">Ver Plan Familia</a></div>`;
} else {
  // la red familiar es la misma de NAVI SOS Family: las líneas del plan y las personas invitadas
  const KEY = 'navi.sos.' + user.owner;
  let S; try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { S = {}; }
  const lines = accountLines(user);
  // quien entró es "me"; la alerta va a los demás integrantes de su red familiar
  const me = lines.find(l => l.phone === user.phone) || lines[0];
  const family = [...lines.filter(l => l !== me), ...(S.extra || []).map(x => ({ name: x.name, img: null, invited: true }))];

  $('app').innerHTML = `<div class="who">${esc(me.name)} · red de <b>${esc(lines.length > 1 ? user.familyName : me.name)}</b></div>
    <button class="btn-sos" id="sos" aria-label="Enviar alerta SOS a mi familia"><div><b>SOS</b><small>TOCA PARA PEDIR AYUDA</small></div></button>
    <p class="hint">${family.length ? 'Tu familia recibe la alerta con tu ubicación. Tienes 5 segundos para cancelar.' : 'Aún no hay más integrantes en tu red. Agrégalos desde NAVI SOS Family.'}</p>
    ${family.length ? `<div class="fam">${family.map(m => face(m)).join('')}</div>` : ''}`;

  const ov = $('ov');
  let timer = null, pos = null;
  const where = () => pos ? `<a href="https://maps.google.com/?q=${pos.lat},${pos.lng}" target="_blank" rel="noopener" style="text-decoration:underline">tu ubicación actual</a>` : 'tu última ubicación conocida';

  function start() {
    if (!family.length) return;
    let n = 5;
    // pide la ubicación mientras corre la cuenta regresiva
    navigator.geolocation?.getCurrentPosition(p => { pos = { lat: p.coords.latitude.toFixed(5), lng: p.coords.longitude.toFixed(5) }; }, () => {}, { enableHighAccuracy: true, timeout: 5000 });
    navigator.vibrate?.(200);
    const draw = () => ov.innerHTML = `<div><div class="big">${n}</div><h1 id="ovTitle">Avisando a tu familia</h1><p>${family.length} ${family.length === 1 ? 'persona recibirá' : 'personas recibirán'} tu alerta con tu ubicación.</p><button class="btn cancel" id="cancel">Cancelar</button></div>`;
    ov.hidden = false; draw(); $('cancel').focus();
    timer = setInterval(() => { n--; navigator.vibrate?.(80); if (n > 0) draw(); else { clearInterval(timer); sent(); } }, 1000);
  }
  function sent() {
    navigator.vibrate?.([300, 120, 300]);
    const t = Date.now(), hh = new Date(t).toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' });
    // queda en la actividad de NAVI SOS Family
    S.events = [...(S.events || []), { t, txt: `🚨 <b>${esc(me.name)}</b> activó SOS desde el botón` }];
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
    ov.innerHTML = `<div><div class="big" style="font-size:84px">🚨</div><h1 id="ovTitle">Tu familia ya está avisada</h1><p>${hh} · enviamos ${where()}</p>
      <div class="list">${family.map(m => `<div>${face(m, m.img ? '' : 'i')}<span>${esc(m.name)}</span><em>${m.invited ? 'SMS con mapa' : 'Alerta en su celular'}</em></div>`).join('')}</div>
      <p style="font-size:12px;margin-bottom:8px">Demostración: no se envían mensajes reales.</p>
      <a class="btn call" href="tel:911">📞 Llamar al 911</a><br><button class="btn btn-lime" id="ok">Estoy bien, terminar alerta</button></div>`;
  }
  $('sos').onclick = start;
  ov.onclick = e => {
    if (e.target.id === 'cancel') { clearInterval(timer); ov.hidden = true; }
    if (e.target.id === 'ok') {
      S.events = [...(S.events || []), { t: Date.now(), txt: `✅ <b>${esc(me.name)}</b> terminó la alerta SOS: está bien` }];
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
      ov.hidden = true;
    }
  };
}

// ícono propio en la pantalla de inicio: se instala aparte de Navi
(() => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone || !user) return;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  $('installTxt').innerHTML = ios ? 'Ponlo en tu pantalla: <b>Compartir ⬆ → Agregar a inicio</b>' : 'Ponlo en tu pantalla de inicio para abrirlo de un toque.';
  $('install').hidden = false;
  let prompt = null;
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); prompt = e; $('installBtn').hidden = false; });
  $('installBtn').onclick = async () => { if (!prompt) return; prompt.prompt(); await prompt.userChoice; prompt = null; $('install').hidden = true; };
  addEventListener('appinstalled', () => { $('install').hidden = true; });
})();
</script>
</body>
</html>
