<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NAVI Mando · Consola</title>
<meta name="theme-color" content="#03060F">
<link rel="icon" href="../assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#08083F;--bg2:#0E0E55;--card:#13136A;--line:#ffffff17;--line2:#ffffff26;--text:#F4F3FF;--muted:#B0AEE0;--lime:#B4E32F;--ink:#06062E;--purple:#7B5CFA;--pink:#FF6FB1;--red:#FF4D6D;--cyan:#7EE0FF;--yellow:#FFC22E;--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.1}
.app{display:grid;grid-template-columns:78px 1fr;grid-template-rows:58px 1fr;height:100vh;height:100dvh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:#06063A}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px}
.brand img{height:26px}
.brand small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);border-left:1px solid var(--line2);padding-left:10px;margin-left:2px}
.top .sp{flex:1}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.bell{position:relative;width:38px;height:38px;border-radius:12px;background:#ffffff0c;display:grid;place-items:center;font-size:17px}
.bell b{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:11px;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13.5px;background:#ffffff10;border:1px solid var(--line2);white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:#ffffff1c}
.btn:active{transform:scale(.97)}
.btn.lime{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.btn.lime:hover{background:#c6f046}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn.ghost{background:none}
.btn.done{background:#b4e32f22;border-color:#b4e32f66;color:var(--lime)}
nav.side{background:#06063A;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:10px 8px;overflow-y:auto}
nav.side button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:14px;color:var(--muted);font-size:11px;font-weight:700;position:relative}
nav.side button i{font-style:normal;font-size:20px;line-height:1}
nav.side button:hover{background:#ffffff0c;color:#fff}
nav.side button.on{background:var(--lime);color:var(--ink)}
nav.side button em{position:absolute;top:4px;right:8px;background:var(--red);color:#fff;font-style:normal;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
main{overflow:auto;position:relative}
.view{padding:20px 22px 28px;min-height:100%}
.vh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.vh h2{font-size:24px}
.vh p{color:var(--muted);font-size:13px;width:100%;margin-top:-6px}
.vh .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi b{font-family:var(--display);font-size:26px;letter-spacing:-.02em}
.kpi b em{font-style:normal;font-size:13px;color:var(--muted);font-family:var(--body);font-weight:500;margin-left:4px}
.kpi.warn b{color:var(--yellow)}.kpi.bad b{color:var(--red)}.kpi.good b{color:var(--lime)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:12px;margin-left:auto}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 9px;background:#ffffff12;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12.5px;color:var(--ink);flex:none;position:relative}
.av.s{width:26px;height:26px;font-size:10.5px}
.bar{height:6px;border-radius:4px;background:#ffffff14;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);border-radius:4px}
input.f,select.f,textarea.f{background:#ffffff0d;border:1px solid var(--line2);border-radius:11px;padding:9px 11px;width:100%;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--lime)}
select.f option{background:#14146A}
label.l{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;color:var(--muted);font-weight:700;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 10px;border-bottom:1px solid #ffffff0a;vertical-align:middle}
table.t tr:hover td{background:#ffffff06}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:13px}
.seg{display:inline-flex;background:#06062Ee6;border:1px solid var(--line2);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--lime);color:var(--ink)}
/* mapa real (Leaflet) */
.map{position:relative;border-radius:18px;overflow:hidden;background:#0E0E55;border:1px solid var(--line);min-height:300px}
.map .lf{position:absolute;inset:0;background:#0E0E55}
.dark-tiles{filter:invert(1) hue-rotate(200deg) brightness(.82) saturate(.55) contrast(.95)}
.leaflet-container{font-family:var(--body);background:#0E0E55}
.leaflet-control-zoom a{background:#14146A!important;color:#fff!important;border-color:var(--line2)!important}
.leaflet-control-scale-line{background:#06062Ecc;color:#fff;border-color:#fff8}
.leaflet-control-attribution{background:#06062Ecc!important;color:#B0AEE0!important;font-size:10px}
.leaflet-control-attribution a{color:#E9E5FF!important}
.mkw{transition:transform 2s linear}
.zooming .mkw{transition:none!important}
.mkw .av{border:2.5px solid #0A0A48;box-shadow:0 4px 12px #0007}
.mkw .av::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid currentColor;opacity:0;animation:ping 2.2s infinite}
.mkw.sos .av::after{opacity:1;animation:ping 1s infinite;color:var(--red)}
.mkw.sel .av{outline:3px solid #fff;outline-offset:2px}
.mkw .nm{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:4px;font-size:11px;font-weight:700;background:#06062Ee6;color:#fff;border-radius:7px;padding:2px 7px;white-space:nowrap;pointer-events:none}
.mkw .gp{position:absolute;right:-6px;top:-6px;font-size:11px;background:#06062E;border-radius:50%;width:17px;height:17px;display:grid;place-items:center}
.mkw.dim{opacity:.35}
@keyframes ping{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.pinw .pin{display:inline-block;transform:translate(-50%,-100%);font-size:11px;font-weight:800;background:#fff;color:var(--ink);border-radius:8px 8px 8px 2px;padding:2px 6px;white-space:nowrap;box-shadow:0 3px 10px #0006}
.pinw .pin.alta{background:var(--pink);color:#fff}.pinw .pin.nueva{outline:2px dashed var(--yellow)}
.zlw span{display:inline-block;transform:translate(-50%,-50%);font-size:10.5px;font-weight:700;color:#fff;background:#06062Ebb;border-radius:6px;padding:1px 6px;white-space:nowrap}
.cpw span{display:block;width:16px;height:16px;border-radius:5px;background:var(--purple);border:2px solid #fff}
.mapctl{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:800;max-width:calc(100% - 70px)}
.mapctl>button,.mapctl>select{background:#06062Ee6;border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700}
.mapctl>button.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.legend{position:absolute;left:12px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;background:#06062Ee6;border-radius:10px;padding:6px 10px;font-size:11px;z-index:800}
.legend span{display:flex;align-items:center;gap:5px}
.map.picking .dark-tiles{filter:invert(1) hue-rotate(200deg) brightness(.82) saturate(.55) contrast(.95)}
.leaflet-container{cursor:crosshair}
.live{display:grid;grid-template-columns:1fr 360px;gap:14px;height:calc(100dvh - 58px);padding:14px}
.lcol{display:flex;flex-direction:column;gap:12px;min-height:0}
.lcol .kpis{margin:0;grid-template-columns:repeat(6,1fr)}
.lcol .kpi{padding:9px 12px}.lcol .kpi b{font-size:22px}
.lcol .map{flex:1}
.ptt{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.ptt .ch{min-width:170px}
.ptt .ch small{display:block;color:var(--muted);font-size:11px}
.ptt .ch select{background:none;border:0;font-weight:800;font-size:15px;font-family:var(--display);outline:none;max-width:200px}
.ptt .ch select option{background:#14146A}
.pttb{width:150px;height:52px;border-radius:16px;background:var(--lime);color:var(--ink);font-family:var(--display);font-weight:800;font-size:15px;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 6px 0 #6f8f12;transition:transform .08s,box-shadow .08s}
.pttb.on{background:var(--red);color:#fff;transform:translateY(4px);box-shadow:0 2px 0 #9b1f36}
.pttlog{flex:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin}
.vz{display:flex;align-items:center;gap:8px;background:#ffffff0c;border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12px;white-space:nowrap}
.vz button{width:26px;height:26px;border-radius:50%;background:var(--lime);color:var(--ink);font-size:11px}
.vz.talk{border-color:var(--red);background:#ff4d6d22}
.wave{display:inline-flex;gap:2px;align-items:center;height:16px}
.wave i{width:3px;background:currentColor;border-radius:2px;animation:wv .8s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}
@keyframes wv{0%,100%{height:4px}50%{height:15px}}
.rside{display:flex;flex-direction:column;gap:12px;min-height:0}
.tabs{display:flex;gap:4px;background:#ffffff0a;border-radius:12px;padding:4px}
.tabs button{flex:1;padding:7px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--muted)}
.tabs button.on{background:#ffffff18;color:#fff}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0;padding-right:2px}
.op{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:#ffffff07;border:1px solid transparent;cursor:pointer;text-align:left;width:100%}
.op:hover{background:#ffffff0f}
.op.sel{border-color:var(--lime);background:#b4e32f12}
.op .i{flex:1;min-width:0}
.op .i b{display:block;font-size:13.5px}
.op .i small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op .r{text-align:right;font-size:11px;color:var(--muted)}
.ev{display:flex;gap:10px;font-size:12.5px;padding:7px 4px;border-bottom:1px solid #ffffff0a}
.ev time{color:var(--muted);font-size:11.5px;min-width:42px}
.det{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.det .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.det .hd b{font-family:var(--display);font-size:17px;display:block}
.det .hd small{color:var(--muted);font-size:12px}
.det .x{margin-left:auto;font-size:18px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stats div{background:#ffffff0a;border-radius:10px;padding:6px;text-align:center}
.stats small{display:block;font-size:10.5px;color:var(--muted)}
.stats b{font-size:13px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.acts .btn{flex-direction:column;gap:2px;font-size:11px;padding:8px 4px}
.acts .btn i{font-style:normal;font-size:16px}
.kan{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#ffffff06;border:1px solid var(--line);border-radius:18px;padding:10px;min-height:300px}
.col h4{font-size:13px;display:flex;align-items:center;gap:8px;margin:2px 4px 10px}
.col h4 b{background:#ffffff18;border-radius:8px;padding:0 7px;font-size:12px}
.oc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,transform .15s}
.oc:hover{border-color:#b4e32f66;transform:translateY(-2px)}
.oc.late{border-color:var(--red)}
.oc .h{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.oc .h .chip{margin-left:auto}
.chip.erp{background:#7EE0FF1f;color:#7EE0FF;border:1px solid #7EE0FF44;align-self:center}
.oc b{display:block;font-size:14px}
.oc small{display:block;color:var(--muted);font-size:12px}
.oc .f{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px}
.oc .f .bar{flex:1}
.prio-alta{background:#ff6fb133;color:#ffb3d6}.prio-media{background:#ffc22e26;color:#ffd977}.prio-baja{background:#ffffff14;color:var(--muted)}
.tl{position:relative;padding-left:18px;margin-top:6px}
.tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line2)}
.tl div{position:relative;font-size:12.5px;padding:3px 0}
.tl div::before{content:"";position:absolute;left:-17px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--lime)}
.tl time{color:var(--muted);margin-right:6px}
.ck{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.evid{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.evid img{height:110px;border-radius:12px;border:1px solid var(--line2);background:#fff}
.sug{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;border:1px solid var(--line);margin-bottom:6px;cursor:pointer}
.sug:has(input:checked){border-color:var(--lime);background:#b4e32f12}
.sug input{accent-color:var(--lime)}
.sug .i{flex:1}
.sug small{color:var(--muted);font-size:11.5px;display:block}
.best{background:var(--lime);color:var(--ink)}
.res{max-height:170px;overflow-y:auto;margin-top:6px}
.res button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:12.5px;border:1px solid var(--line);margin-bottom:4px}
.res button:hover,.res button.on{border-color:var(--lime);background:#b4e32f12}
.chat{display:grid;grid-template-columns:290px 1fr;gap:12px;height:calc(100dvh - 58px - 100px)}
.convs{overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.convs h5{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 6px 4px;display:flex;align-items:center}
.convs h5 button{margin-left:auto;font-size:11.5px;color:var(--lime);font-weight:800;letter-spacing:0;text-transform:none}
.cv{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:13px;cursor:pointer;text-align:left;width:100%}
.cv:hover{background:#ffffff0a}.cv.on{background:#ffffff16}
.cv .i{flex:1;min-width:0}.cv b{font-size:13.5px;display:block}
.cv small{color:var(--muted);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv em{font-style:normal;background:var(--lime);color:var(--ink);font-size:11px;font-weight:800;border-radius:9px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.thread{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:0}
.thread .th{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:70%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:#ffffff12;font-size:13.5px}
.bub.me{align-self:flex-end;background:var(--purple);border-radius:14px 14px 4px 14px}
.bub.dif{align-self:center;max-width:85%;background:#b4e32f1c;border:1px solid #b4e32f55;border-radius:14px;text-align:center}
.bub small{display:block;font-size:10.5px;color:#ffffffaa;margin-top:3px}
.bub .who{font-size:11px;font-weight:800;color:var(--cyan);display:block}
.bub audio{height:32px;max-width:230px;display:block;margin-top:2px}
.comp{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:center}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.quick button{font-size:12px;background:#ffffff0d;border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.mem{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:300px;overflow-y:auto}
.mem label{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;cursor:pointer}
.mem label:has(input:checked){border-color:var(--lime);background:#b4e32f12}
.mem h6{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center}
.mem h6 button{margin-left:auto;color:var(--lime);font-size:11.5px;font-weight:800}
.al{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:5px solid;border-radius:16px;padding:13px 16px;margin-bottom:10px;flex-wrap:wrap}
.al .ic{font-size:26px}
.al .i{flex:1;min-width:240px}
.al .i b{font-size:15px;display:block}
.al .i small{color:var(--muted)}
.al .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}
.proto{width:100%;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;padding-top:10px;border-top:1px dashed var(--line2)}
.proto b{width:100%;font-size:12px;color:var(--muted)}
.proto button{font-size:12px;border:1px solid var(--line2);border-radius:99px;padding:5px 10px;text-align:left}
.proto button.on{background:#b4e32f22;border-color:#b4e32f88;color:var(--lime)}
.evac{background:linear-gradient(135deg,#ff4d6d33,#ff7a4522);border:1px solid #ff4d6d88;border-radius:18px;padding:16px;margin-bottom:16px}
.evac h3{font-size:19px;display:flex;align-items:center;gap:8px}
.roll{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:12px}
.roll div{display:flex;align-items:center;gap:8px;background:#06062E99;border-radius:12px;padding:8px 10px;font-size:12.5px}
.roll div b{flex:1}
.hb{display:flex;align-items:center;gap:10px;font-size:12.5px;margin:7px 0}
/* tech.css usa .hb para botones de la app: aquí son barras de reporte */
.card .hb{width:auto;height:auto;display:flex;place-items:normal;border:0;border-radius:0;background:none;color:inherit;font-size:12.5px;line-height:1.3;box-shadow:none;transform:none}
.hb span{width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .bar{flex:1;height:10px}
.hb b{width:54px;text-align:right}
.sum{background:linear-gradient(135deg,#7b5cfa33,#b4e32f1a);border:1px solid #b4e32f44;border-radius:18px;padding:16px;font-size:14px;line-height:1.6}
.sum b{color:var(--lime)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.r3{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.ov{position:fixed;inset:0;background:#02021ccc;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:1500;padding:16px;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.md{background:#11115F;border:1px solid var(--line2);border-radius:22px;width:min(560px,100%);max-height:90dvh;overflow-y:auto;padding:20px;box-shadow:0 30px 80px #0009}
.md.wide{width:min(780px,100%)}
.md .mh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.md .mh h3{font-size:20px}
.md .mh button{margin-left:auto;font-size:22px;color:var(--muted)}
.md .mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.sosov{background:#3a0010ee}
.sosov .md{border:2px solid var(--red);background:#2a0614;text-align:center;animation:shake .5s 2}
.sosov.silent .md{border-color:var(--yellow);background:#2a1a06}
.sosov .big{font-size:60px;line-height:1}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.toast{position:fixed;right:18px;bottom:18px;z-index:1600;display:flex;flex-direction:column;gap:8px}
.toast div{background:#fff;color:var(--ink);font-weight:700;border-radius:14px;padding:10px 14px;box-shadow:0 10px 30px #0007;animation:fi .2s;max-width:340px;font-size:13px}
.me{display:flex;align-items:center;gap:9px;font-size:12px;background:#ffffff0a;border:1px solid var(--line2);border-radius:12px;padding:4px 5px 4px 10px}
.me b{display:block;font-size:12.5px;line-height:1.2}
.me small{display:block;color:var(--muted);font-size:11px;line-height:1.2}
.me button{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line2);border-radius:9px;padding:5px 9px}
.me button:hover{color:#fff;border-color:var(--lime)}
/* rutas y desvíos */
.rutas{display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:16px;align-items:start}
.rutas > div:first-child{max-height:calc(100vh - 210px);overflow:auto;padding-right:4px}
@media (max-width:1050px){.rutas{grid-template-columns:1fr}.rutas > div:first-child{max-height:none}}
.rrole{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:10px 12px;border-radius:14px;border:1px solid var(--line2);background:#ffffff08;margin-bottom:12px}
.rrole.adm{border-color:#b4e32f55;background:#b4e32f12}
.rt-h{font-size:13px;color:var(--muted);margin:16px 0 8px;letter-spacing:.04em;text-transform:uppercase}
.card.req{border-color:#ffc22e88;box-shadow:0 0 0 1px #ffc22e33,0 0 24px #ffc22e22;margin-bottom:12px}
.card.trip{margin-bottom:10px;cursor:pointer;transition:border-color .2s}
.card.trip.on{border-color:var(--lime)}.card.trip.off{border-color:#ff4d6d99}
.trip .th{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.trip .th .sp{flex:1}
.rq-who{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rq-who b{display:block;font-size:13.5px}.rq-who small{display:block;color:var(--muted);font-size:12px}
.rq-mot{display:flex;gap:10px;align-items:flex-start;background:#ffffff0a;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.rq-mot > span:first-child{font-size:22px}.rq-mot small{display:block;color:var(--muted);margin-top:2px}
.tr-ft{display:flex;gap:8px;font-size:13px;margin-bottom:8px;color:#dfe3ff}
.row-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.row-b .lock{font-size:12.5px;color:var(--yellow);font-weight:700;margin-right:auto}
.chip.ok{background:#b4e32f22;color:var(--lime)}.chip.warn{background:#ffc22e22;color:var(--yellow)}.chip.bad{background:#ff4d6d33;color:#ff9db0}
.manv{height:100%;display:flex}
.manv iframe{flex:1;width:100%;border:0;min-height:calc(100dvh - 58px);background:#0B0B4F}
/* editor de layout */
.lyw{display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start}
.lyc{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:#0E0E55;user-select:none;touch-action:none}
.lyc img{display:block;width:100%;height:100%;pointer-events:none}
.lyc svg{position:absolute;inset:0;width:100%;height:100%}
.lya .b{fill:transparent;stroke:transparent;stroke-width:.3;cursor:move}
.lya:hover .b{stroke:#ffffffaa;stroke-dasharray:.8 .5}
.lya.on .b{stroke:#B4E32F;stroke-width:.45;fill:#b4e32f14}
.lya .h{fill:#B4E32F;stroke:#06062E;stroke-width:.2;cursor:nwse-resize}
.lyp{display:flex;flex-direction:column;gap:12px}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal button{display:flex;align-items:center;gap:6px;text-align:left;font-size:12px;font-weight:700;border:1px solid var(--line2);border-radius:10px;padding:7px 8px;background:#ffffff08}
.pal button:hover{border-color:var(--lime);background:#b4e32f12}
.pal button i{font-style:normal;font-size:15px}
.cliente{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media (max-width:1100px){.lyw{grid-template-columns:1fr}}
.demo{font-size:11.5px;color:var(--muted);background:#ffffff0a;border:1px dashed var(--line2);border-radius:10px;padding:6px 10px}
@media (max-width:1100px){.live{grid-template-columns:1fr;height:auto}.lcol .map{min-height:440px}.rside .list{max-height:420px}.lcol .kpis{grid-template-columns:repeat(3,1fr)}.r2,.r3{grid-template-columns:1fr}}
@media (max-width:760px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:54px auto 1fr;height:auto;min-height:100dvh}
  nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;position:sticky;top:0;z-index:1000}
  nav.side button{min-width:68px}
  main{overflow:visible}
  .brand small,.clock,.top .hide-m{display:none}
  .view{padding:16px 14px 90px}
  .live{padding:12px 12px 90px}
  .lcol .kpis{grid-template-columns:repeat(2,1fr)}
  .ptt{flex-wrap:wrap}.pttb{flex:1}
  .chat{grid-template-columns:1fr;height:auto}.convs{max-height:260px}.thread{min-height:460px}
  .grid2,.mem{grid-template-columns:1fr}
  .tw{overflow-x:auto}
}
</style>
<link rel="stylesheet" href="tech.css?v=1">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="../empresas.html#mando" title="Volver a Empresas"><img src="../assets/navi-logo.png" alt="Navi">Mando<small id="emp"></small></a>
    <span class="sp"></span>
    <div class="me" id="me"></div>
    <span class="clock" id="clock"></span>
    <button class="bell" id="manBtn" title="Manual de procesos">📘</button>
    <button class="bell" id="bell" title="Alertas">🔔<b id="bellN" hidden></b></button>
    <a class="btn sm lime" href="app/" target="_blank" rel="noopener">📱 <span class="hide-m">App del operador</span></a>
  </header>
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="mando.js?v=9"></script>
<script>
const M = Mando, E = M.esc, $ = id => document.getElementById(id);
// solo entran clientes con usuario: la empresa la define la sesión, no se cambia desde adentro
const SES = M.Auth.current();
if (!SES) { location.replace('login.html?next=' + encodeURIComponent('index.html' + location.hash)); throw new Error('sin sesión'); }
M.useClient(SES.client);
let S = M.load();
let view = (location.hash.slice(1) || 'vivo');
if (view === 'ordenes') view = 'vivo';
const ui = { trip: null, optPick: {}, seenReq: new Set(), sel: null, side: 'equipo', grp: 'all', site: 'city', show: { ord: true, zon: true, trail: true }, conv: 'all', pttCh: 'all', ordQ: '', ordG: 'all', pick: null, seenSos: new Set(), talking: false };
try { Object.assign(ui.show, JSON.parse(localStorage.getItem('navi.mando.ui') || '{}')); } catch (e) {}

const VIEWS = [
  ['vivo', '🛰️', 'En vivo'], ['rutas', '🛣️', 'Rutas'], ['rondines', '🛡️', 'Rondines'], ['geocercas', '📍', 'Geocercas'],
  ['mensajes', '💬', 'Mensajes'], ['alertas', '🚨', 'Alertas'], ['reportes', '📊', 'Reportes'], ['equipo', '👥', 'Equipo'], ['layout', '🏗️', 'Layout'], ['manual', '📘', 'Manual']
];
const op = id => S.ops.find(p => p.id === id);
const grp = id => S.groups.find(g => g.id === id);
const chatG = id => S.chats.find(c => c.id === id);
const siteN = id => M.site(S, id);
const stc = p => (M.STATUS[p.status] || M.STATUS.fuera).c;
const avatar = (p, cls) => p ? `<span class="av ${cls || ''}" style="background:${stc(p)};color:${stc(p)}"><span style="color:var(--ink)">${E(p.ini)}</span></span>` : '<span class="av s" style="background:#ffffff22">—</span>';
const today = ts => new Date(ts).toDateString() === new Date().toDateString();
const isGps = p => p.gps && Date.now() - p.gps < 120000;
const brk = p => Math.max(0, Math.round((Date.now() - (p.recesoAt || Date.now())) / M.MIN)) + ' min';
const where = p => { const st = siteN(p.site), a = M.areaAt(S, p.site, p.x, p.y); return st.icon + ' ' + (a ? a.name : st.kind === 'indoor' ? st.name : 'En calle'); };
const unread = () => S.msgs.filter(m => m.from !== 'consola' && m.to !== 'all' && !m.reads.includes('consola'));
const openAlerts = () => S.alerts.filter(a => a.status !== 'cerrada');
function toast(t) { const d = document.createElement('div'); d.textContent = t; $('toast').appendChild(d); setTimeout(() => d.remove(), 3800); }
const siteSeg = (cur, attr) => `<div class="seg" ${attr}>${S.sites.map(s => `<button data-site="${s.id}" class="${cur === s.id ? 'on' : ''}">${s.icon} ${E(s.kind === 'indoor' ? s.name.split(' · ')[0] : 'Ciudad')} <span style="opacity:.7">${S.ops.filter(p => p.site === s.id && p.status !== 'fuera').length}</span></button>`).join('')}</div>`;

function nav() {
  const na = openAlerts().length + (S.evac ? 1 : 0), nm = unread().length;
  const badge = { alertas: na, mensajes: nm, rutas: (S.trips || []).filter(t => t.status === 'enruta' && (t.off || (t.req && t.req.status === 'pendiente'))).length };
  $('nav').innerHTML = VIEWS.filter(v => v[0] !== 'rutas' || S.trips).map(([k, i, t]) => `<button class="${k === view ? 'on' : ''}" data-v="${k}"><i>${i}</i>${t}${badge[k] ? `<em>${badge[k]}</em>` : ''}</button>`).join('');
  $('bellN').hidden = !na; $('bellN').textContent = na;
  $('emp').textContent = S.empresa;
  const me = $('me');
  if (!me.childElementCount) {
    const c = M.CLIENTS[SES.client];
    me.title = c.tipo + ' · ' + c.name;
    me.innerHTML = `<span class="hide-m"><b>${E(SES.name)}</b><small>${c.icon} ${E(c.tipo)} · ${E(SES.role)}</small></span><button id="refr" title="Refrescar la consola">⟳</button><button id="salir">⏻ Salir</button>`;
    $('refr').onclick = () => location.reload();
    $('salir').onclick = () => { if (confirm('¿Cerrar tu sesión de NAVI Mando?')) { M.Auth.logout(); location.replace('login.html?salir=1'); } };
    $('manBtn').onclick = () => { view = 'manual'; location.hash = 'manual'; render(); };
  }
}
// manual de procesos dentro de la consola (solo con sesión de cliente)
const vManual = () => `<div class="manv"><iframe src="manual.html?embed=1" title="Manual de procesos de NAVI Mando"></iframe></div>`;
$('nav').onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); };
$('bell').onclick = () => go('alertas');
function go(v) { view = v; location.hash = v; ui.pick = null; render(); $('main').scrollTop = 0; }
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== view && VIEWS.some(x => x[0] === v)) { view = v; render(); } });

// ---------- mapa: calles reales en la ciudad, plano en metros en el almacén ----------
const LL = (sid, x, y) => { const st = siteN(sid); return st.kind === 'indoor' ? [st.h - y, x] : M.toLL(x, y); };
const XY = (sid, ll) => { const st = siteN(sid); return st.kind === 'indoor' ? { x: +ll.lng.toFixed(1), y: +(st.h - ll.lat).toFixed(1) } : M.fromLL(ll.lat, ll.lng); };
const radM = (sid, r) => siteN(sid).kind === 'indoor' ? r : r * 310;
function mapShell(id, extra) { return `<div class="map" id="${id}"><div class="lf"></div>${extra || ''}</div>`; }
function lmap(el, sid) {
  // si cambió el layout del almacén se vuelve a dibujar el plano
  const s0 = siteN(sid), sig = s0.kind === 'indoor' ? JSON.stringify([s0.w, s0.h, s0.areas]) : '';
  if (el._L && el._sid === sid && el._sig === sig) return el._L;
  el._sig = sig;
  if (el._L) {
    // detener animaciones antes de quitar el mapa y usar un contenedor nuevo
    try { el._L.stop(); el._L.off(); el._L.remove(); } catch (e) {}
    el._L = null; el._mk = {};
    const old = el.querySelector('.lf'), nb = document.createElement('div'); nb.className = 'lf'; old.replaceWith(nb);
  }
  const st = siteN(sid), box = el.querySelector('.lf');
  let m;
  if (st.kind === 'indoor') {
    m = L.map(box, { crs: L.CRS.Simple, minZoom: 1, maxZoom: 6, zoomSnap: .25, zoomControl: false, attributionControl: false });
    const b = [[0, 0], [st.h, st.w]];
    L.imageOverlay(M.planSVG(st), b).addTo(m);
    m.fitBounds(b, { padding: [14, 14] }); m.setMaxBounds([[-25, -25], [st.h + 25, st.w + 25]]);
  } else {
    m = L.map(box, { zoomControl: false }).setView([19.42, -99.16], 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, className: 'dark-tiles', attribution: '© OpenStreetMap' }).addTo(m);
  }
  L.control.zoom({ position: 'topright' }).addTo(m);
  L.control.scale({ position: 'bottomright', imperial: false }).addTo(m);
  el._L = m; el._sid = sid; el._g = L.layerGroup().addTo(m); el._mk = {};
  m.on('zoomstart', () => el.classList.add('zooming'));
  m.on('zoomend', () => setTimeout(() => el.classList.remove('zooming'), 80));
  m.on('click', e => el._onMap && el._onMap(XY(sid, e.latlng)));
  const fix = () => { if (el._L === m && document.body.contains(box)) m.invalidateSize(); };
  if (window.ResizeObserver) new ResizeObserver(fix).observe(box);
  setTimeout(fix, 60);
  return m;
}
function fitOps(el, sid) {
  const m = el._L, pts = S.ops.filter(p => p.site === sid && p.status !== 'fuera').map(p => LL(sid, p.x, p.y));
  if (!m) return;
  if (siteN(sid).kind === 'indoor') { const st = siteN(sid); m.fitBounds([[0, 0], [st.h, st.w]], { padding: [14, 14] }); }
  else if (pts.length) m.fitBounds(pts, { padding: [50, 50], maxZoom: 15 });
}
function drawMap(el, o) {
  if (!el) return;
  const sid = o.site, m = lmap(el, sid), g = el._g;
  el._onMap = o.onMap || null;
  g.clearLayers();
  if (o.zones) S.zones.filter(z => z.site === sid).forEach(z => {
    const c = z.type === 'restringida' ? '#FF4D6D' : z.type === 'base' ? '#B4E32F' : '#9B80FF';
    L.circle(LL(sid, z.x, z.y), { radius: radM(sid, z.r), color: c, weight: 2, dashArray: '6 5', fillColor: c, fillOpacity: .12, interactive: false }).addTo(g);
    L.marker(LL(sid, z.x, z.y), { icon: L.divIcon({ className: 'zlw', html: `<span>${E(z.name)}${z.allow ? ' 🔒' : ''}</span>`, iconSize: [0, 0] }), interactive: false }).addTo(g);
  });
  if (o.trail) { const p = op(o.trail); if (p && p.site === sid && p.trail.length > 1) L.polyline(p.trail.map(t => LL(sid, t[0], t[1])).concat([LL(sid, p.x, p.y)]), { color: '#B4E32F', weight: 3, dashArray: '4 6', interactive: false }).addTo(g); }
  if (o.routes) S.routes.filter(r => r.site === sid).forEach(r => { const pts = r.points.map(id => S.points.find(c => c.id === id)).filter(Boolean); if (pts.length > 1) L.polyline(pts.concat([pts[0]]).map(c => LL(sid, c.x, c.y)), { color: '#9B80FF', weight: 2, dashArray: '5 5', interactive: false }).addTo(g); });
  // viajes: ruta vigente, corredor de tolerancia (ancho real en metros), ruta original y propuestas pendientes
  if (o.trips && S.trips && siteN(sid).kind !== 'indoor') {
    const mpp = 156543.03 * Math.cos(19.42 * Math.PI / 180) / 2 ** m.getZoom(), P = q => LL(sid, q[0], q[1]);
    S.trips.filter(tr => tr.status === 'enruta').forEach(tr => {
      const sel = ui.trip === tr.id, dim = ui.trip && !sel, pend = tr.req && tr.req.status === 'pendiente';
      if (tr.base && !dim) L.polyline(tr.base.map(P), { color: '#8A8FB0', weight: 3, opacity: .55, dashArray: '2 8', interactive: false }).addTo(g);
      L.polyline(tr.path.map(P), { color: tr.off ? '#FF4D6D' : '#22F0FF', weight: Math.max(8, 2 * (tr.tol || 1.2) * 310 / mpp), opacity: dim ? .05 : .14, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(g);
      L.polyline(tr.path.map(P), { color: tr.off ? '#FF4D6D' : tr.alt ? '#B4E32F' : '#22F0FF', weight: sel ? 4 : 3, opacity: dim ? .3 : .95, interactive: false }).addTo(g);
      if (pend && !dim) tr.req.opts.forEach(x => L.polyline(x.path.map(P), { color: '#FFC22E', weight: 3, dashArray: '7 7', opacity: x.id === (ui.optPick[tr.id] || tr.req.pick) ? .95 : .4, interactive: false }).addTo(g));
      const end = tr.path[tr.path.length - 1];
      L.marker(P(end), { icon: L.divIcon({ className: 'zlw', html: `<span>🏁 ${E(tr.folio)} · ${E(tr.to)}</span>`, iconSize: [0, 0] }), interactive: false }).addTo(g);
    });
  }
  if (o.pickAt) L.circle(LL(sid, o.pickAt.x, o.pickAt.y), { radius: radM(sid, o.pickAt.r), color: '#B4E32F', weight: 2, fillOpacity: .2 }).addTo(g);
  if (o.points) S.points.filter(c => c.site === sid).forEach(c => {
    L.marker(LL(sid, c.x, c.y), { icon: L.divIcon({ className: 'cpw', html: '<span></span>', iconSize: [16, 16], iconAnchor: [8, 8] }), title: c.code + ' ' + c.name }).addTo(g);
    L.marker(LL(sid, c.x, c.y), { icon: L.divIcon({ className: 'zlw', html: `<span style="transform:translate(-50%,10px)">${E(c.code)}</span>`, iconSize: [0, 0] }), interactive: false }).addTo(g);
  });
  // operadores: se reutilizan para que se deslicen suavemente
  const seen = {};
  if (o.ops) S.ops.filter(p => p.status !== 'fuera' && p.site === sid).forEach(p => {
    seen[p.id] = 1;
    const cls = 'mkw' + (p.status === 'sos' ? ' sos' : '') + (ui.sel === p.id ? ' sel' : '') + (o.grp && o.grp !== 'all' && p.group !== o.grp ? ' dim' : '');
    const html = avatar(p) + `<span class="nm">${E(p.name.split(' ')[0])}${p.status === 'receso' ? ' · 🍽️ ' + brk(p) : ''}</span>` + (isGps(p) ? '<span class="gp" title="GPS real">📡</span>' : p.status === 'receso' ? '<span class="gp" title="En receso">🍽️</span>' : '');
    let mk = el._mk[p.id];
    if (!mk) { mk = L.marker(LL(sid, p.x, p.y), { zIndexOffset: 500 }).addTo(m); mk.on('click', () => o.onOp && el._onOp && el._onOp(p.id)); el._mk[p.id] = mk; }
    if (mk._key !== cls + html) { mk.setIcon(L.divIcon({ className: cls, html, iconSize: [34, 34], iconAnchor: [17, 17] })); mk._key = cls + html; }
    mk.setLatLng(LL(sid, p.x, p.y));
  });
  el._onOp = o.onOp || null;
  Object.keys(el._mk).forEach(id => { if (!seen[id]) { m.removeLayer(el._mk[id]); delete el._mk[id]; } });
  if (!el._fit && o.fit) { el._fit = 1; fitOps(el, sid); }
}

// ---------- EN VIVO ----------
function vVivo() {
  return `<div class="live">
    <div class="lcol">
      <div class="kpis" id="lk"></div>
      ${mapShell('lmap', `<div class="mapctl">${siteSeg(ui.site, 'id="siteS"')}<select id="fG"><option value="all">Todos los departamentos</option>${S.groups.map(g => `<option value="${g.id}" ${ui.grp === g.id ? 'selected' : ''}>${E(g.name)}</option>`).join('')}</select>

function bindPtt(btn, ch) {

    const r = await M.Ptt.stop();

  };

}

    ui.lay.sel = a.id; svg.setPointerCapture(e.pointerId); let moved = false;
    svg.onpointermove = ev => {
      const p = pt(ev), dx = p.x - p0.x, dy = p.y - p0.y; if (Math.abs(dx) + Math.abs(dy) > .3) moved = true;
      if (mode === 'move') { a.x = clampN(snap(o.x + dx), 0, d.w - a.w); a.y = clampN(snap(o.y + dy), 0, d.h - a.h); }
      else { a.w = clampN(snap(o.w + dx), 1, d.w - a.x); a.h = clampN(snap(o.h + dy), 1, d.h - a.y); }
      if (moved) lyDirty(); lyDraw();
    };
    svg.onpointerup = () => { svg.onpointermove = null; svg.onpointerup = null; lyDraw(); lyForm(); };
    lyDraw(false); lyForm();
  };
  document.onkeydown = e => {
    if (view !== 'layout' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    const a = lyArea(); if (!a) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); return lyRemove(); }
    const mv = { ArrowLeft: [-.5, 0], ArrowRight: [.5, 0], ArrowUp: [0, -.5], ArrowDown: [0, .5] }[e.key]; if (!mv) return;
    e.preventDefault(); a.x = clampN(a.x + mv[0], 0, d.w - a.w); a.y = clampN(a.y + mv[1], 0, d.h - a.h); lyDirty(); lyDraw(); lyForm();
  };
  lyDraw(); lyForm();
}

// ---------- render general ----------
const R = { vivo: [vVivo, bindVivo], rutas: [vRutas, bindRutas], rondines: [vRondines, bindRondines], geocercas: [vGeocercas, bindGeocercas], mensajes: [vMensajes, bindMensajes], alertas: [vAlertas, bindAlertas], reportes: [vReportes, () => document.querySelectorAll('[data-csv]').forEach(b => b.onclick = () => csv(b.dataset.csv))], equipo: [vEquipo, bindEquipo], layout: [vLayout, bindLayout], manual: [vManual, () => {}] };
function render() {
  if (!R[view] || (view === 'rutas' && !S.trips)) view = 'vivo';
  if (!S.sites.some(s => s.id === ui.site)) ui.site = S.sites[0].id;
  nav();
  // los mapas se conservan entre refrescos para no recargar las calles
  const keep = {}; $('main').querySelectorAll('.map[id]').forEach(m => { if (m._L) keep[m.id] = m; });
  $('main').innerHTML = R[view][0]();
  Object.keys(keep).forEach(id => { const n = document.getElementById(id); if (n) { n.replaceWith(keep[id]); const ex = n.querySelectorAll(':scope > :not(.lf)'); keep[id].querySelectorAll(':scope > :not(.lf)').forEach(x => x.remove()); ex.forEach(x => keep[id].appendChild(x)); keep[id]._L.invalidateSize(); } else { const k = keep[id]; try { k._L.stop(); k._L.off(); k._L.remove(); } catch (e) {} k._L = null; } });
  R[view][1]();
  if (view === 'vivo') liveRefresh();
}
let lastMsgCount = S.msgs.length;
function refresh() {
  nav(); sosWatch();
  const nm = S.msgs.length;
  if (nm > lastMsgCount) {
    S.msgs.slice(lastMsgCount).filter(m => m.from !== 'consola').forEach(m => {
      if (m.kind === 'voz') { toast('🎙️ ' + (op(m.from)?.name || '') + ' habló por radio'); if (m.audio) playVoice(m.id); }
      else if (view !== 'mensajes' || ui.conv !== convOf(m)) { toast('💬 ' + (op(m.from)?.name || '') + (m.to.startsWith('p') || m.to === 'consola' ? '' : ' en ' + chName(m.to)) + ': ' + m.txt); M.beep(); }
    });
  }
  lastMsgCount = nm;
  reqWatch();
  if (view === 'vivo') return liveRefresh();
  if (view === 'rutas') { if (!document.querySelector('.ov')) rutasRefresh(); return; }
  if (view === 'mensajes') { thread(); const c = document.querySelector('.convs'); if (c) { const st = c.scrollTop; c.innerHTML = convsHTML(); c.scrollTop = st; } return; }
  if (document.querySelector('.ov') || view === 'layout' || view === 'manual') return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $('main').contains(a)) return;
  if (ui.pick) return;
  const st = $('main').scrollTop; render(); $('main').scrollTop = st;
}
let fromTick = false, ticks = 0, pend = false;
M.on(s => {
  S = s;
  if (fromTick && view !== 'vivo' && view !== 'rutas' && ticks % 5) { sosWatch(); return; }
  if (pend) return; pend = true;
  queueMicrotask(() => { pend = false; refresh(); });
});
setInterval(() => { ticks++; try { localStorage.setItem(M.hbKey(), Date.now()); } catch (e) {} fromTick = true; M.tick(); fromTick = false; }, 2000);
setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }, 1000);
// aviso cuando un chofer pide cambio de ruta o se sale de ella
function reqWatch() {
  (S.trips || []).forEach(t => {
    const r = t.req;
    if (r && r.status === 'pendiente' && !ui.seenReq.has(r.id)) { ui.seenReq.add(r.id); if (ui.booted) { M.beep(); toast('🔀 ' + (op(t.opId)?.name || '') + ' pide ruta alterna: ' + motT(r.motivo).t + (SES.admin ? '' : ' · la autoriza el administrador')); } }
    const k = 'off:' + t.id + ':' + t.offAt;
    if (t.off && !ui.seenReq.has(k)) { ui.seenReq.add(k); if (ui.booted) { M.beep(true); toast('⚠️ ' + (op(t.opId)?.name || '') + ' se salió de su ruta · ' + t.folio); } }
  });
  ui.booted = true;
}
render(); sosWatch(); reqWatch();
</script>
