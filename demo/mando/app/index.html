<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NAVI Mando · Operador</title>
<meta name="theme-color" content="#03060F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../../assets/icon-192.png">
<link rel="apple-touch-icon" href="../../assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Navi Mando">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#08083F;--card:#13136A;--line:#ffffff17;--line2:#ffffff26;--text:#F4F3FF;--muted:#B0AEE0;--lime:#B4E32F;--ink:#06062E;--purple:#7B5CFA;--red:#FF4D6D;--cyan:#7EE0FF;--yellow:#FFC22E;--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#02021c;color:var(--text);font:15px/1.45 var(--body);min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.1}
.phone{max-width:430px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media (min-width:600px){body{padding:20px 0;background:radial-gradient(circle at 30% 20%,#1E1E8A,#02021c 60%)}.phone{min-height:860px;height:860px;border-radius:40px;border:10px solid #000;overflow:hidden;box-shadow:0 40px 90px #000a}}
.hd{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;padding-top:max(14px,env(safe-area-inset-top))}
.hd .who{flex:1;min-width:0}
.hd b{display:block;font-family:var(--display);font-size:17px}
.hd small{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--ink);flex:none}
.stb{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:99px;padding:7px 12px;background:#ffffff12}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.scr{flex:1;overflow-y:auto;padding:4px 16px 110px}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:#06063Af2;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 6px max(8px,env(safe-area-inset-bottom));z-index:6}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;position:relative}
.tabbar button i{font-style:normal;font-size:21px}
.tabbar button.on{color:var(--lime)}
.tabbar button em{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;font-style:normal;font-size:10px;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
/* botón de emergencia empresarial */
.sos{position:absolute;right:14px;bottom:84px;height:58px;padding:0 18px 0 14px;border-radius:18px;background:var(--red);color:#fff;font-family:var(--display);font-weight:800;font-size:13px;line-height:1.05;box-shadow:0 8px 24px #ff4d6d77;z-index:7;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;align-items:center;gap:8px;overflow:hidden;text-align:left}
.sos i{font-style:normal;font-size:24px}
.sos small{display:block;font-family:var(--body);font-weight:700;font-size:10px;opacity:.85}
.sos .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffffff40}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card h3 small{margin-left:auto;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:16px;padding:14px;font-weight:800;font-size:15px;background:#ffffff12;border:1px solid var(--line2)}
.btn:active{transform:scale(.98)}
.btn.lime{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:12px;width:auto}
.row{display:flex;gap:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.stats small{display:block;font-size:11px;color:var(--muted)}
.stats b{font-family:var(--display);font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line2);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.chips button.on{background:#fff;color:var(--ink)}
.loc{display:flex;align-items:center;gap:10px;font-size:13px;background:#ffffff0a;border-radius:14px;padding:10px 12px;margin-top:12px}
.loc b{flex:1}
.oc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.oc .h{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:4px}
.oc .h span:last-child{margin-left:auto}
.oc b{display:block;font-size:16px}
.oc small{display:block;color:var(--muted);font-size:13px}
.pill{font-size:11px;font-weight:800;border-radius:99px;padding:3px 9px;background:#ffffff14}
.pill.alta{background:#ff6fb133;color:#ffb3d6}.pill.new{background:var(--lime);color:var(--ink)}
.bar{height:6px;border-radius:4px;background:#ffffff14;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime)}
.steps{display:flex;gap:4px;margin:12px 0}
.steps i{flex:1;height:5px;border-radius:3px;background:#ffffff1c}
.steps i.on{background:var(--lime)}
.ck{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#ffffff08;margin-bottom:6px;font-size:14.5px;width:100%;text-align:left}
.ck span{width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;flex:none;font-size:14px}
.ck.on span{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.omap{height:190px;border-radius:16px;overflow:hidden;margin:10px 0;background:#0E0E55}
.dark-tiles{filter:invert(1) hue-rotate(200deg) brightness(.82) saturate(.55) contrast(.95)}
.leaflet-container{background:#0E0E55;font-family:var(--body)}
.leaflet-control-attribution{background:#06062Ecc!important;color:#B0AEE0!important;font-size:9px}
.leaflet-control-attribution a{color:#E9E5FF!important}
.mepin{width:18px;height:18px;border-radius:50%;background:var(--cyan);border:3px solid #fff;box-shadow:0 0 0 6px #7ee0ff44}
.dpin{font-size:28px;line-height:1;transform:translate(-2px,-14px)}
canvas.sig{width:100%;height:170px;background:#fff;border-radius:14px;touch-action:none;display:block}
.photo{width:100%;border-radius:14px;margin-top:8px;display:block}
.ptt{width:210px;height:210px;border-radius:50%;margin:20px auto 14px;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#d4f56b,var(--lime));color:var(--ink);font-family:var(--display);font-weight:800;font-size:20px;box-shadow:0 14px 0 #6f8f12,0 20px 50px #b4e32f55;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .08s,box-shadow .08s;text-align:center;line-height:1.2}
.ptt.on{background:radial-gradient(circle at 40% 30%,#ff8fa4,var(--red));color:#fff;transform:translateY(10px);box-shadow:0 4px 0 #9b1f36,0 0 0 18px #ff4d6d33}
.ptt small{display:block;font-family:var(--body);font-size:12px;font-weight:700;opacity:.75}
.vz{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:#ffffff0a;margin-bottom:6px;font-size:13px}
.vz button{width:36px;height:36px;border-radius:50%;background:var(--lime);color:var(--ink);flex:none}
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.bub{max-width:82%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:#ffffff14;font-size:14.5px}
.bub.me{align-self:flex-end;background:var(--purple);border-radius:16px 16px 4px 16px}
.bub.dif{align-self:center;background:#b4e32f1c;border:1px solid #b4e32f55;border-radius:16px;text-align:center;max-width:95%}
.bub small{display:block;font-size:11px;color:#ffffffaa;margin-top:2px}
.bub .w{font-size:11.5px;font-weight:800;color:var(--cyan);display:block}
.comp{position:absolute;left:0;right:0;bottom:66px;display:flex;gap:8px;padding:8px 12px;background:var(--bg);border-top:1px solid var(--line);z-index:5}
input.f,select.f,textarea.f{background:#ffffff0d;border:1px solid var(--line2);border-radius:14px;padding:12px 13px;width:100%;outline:none}
input.f:focus,textarea.f:focus{border-color:var(--lime)}
select.f option{background:#14146A}
.seg{display:flex;background:#ffffff0c;border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:#ffffff1c;color:#fff}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.li i{font-style:normal;font-size:22px}
.li span{flex:1;min-width:0}
.li small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li em{font-style:normal;background:var(--lime);color:var(--ink);font-size:11px;font-weight:800;border-radius:9px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.sw{width:46px;height:28px;border-radius:99px;background:#ffffff22;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--lime)}.sw.on::after{transform:translateX(18px)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--muted);margin:2px 0 10px}
.ov{position:absolute;inset:0;background:#02021ccc;z-index:30;display:flex;align-items:flex-end;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.sheet{background:#11115F;border-radius:26px 26px 0 0;padding:20px 18px max(20px,env(safe-area-inset-bottom));width:100%;max-height:90%;overflow-y:auto}
.sheet h3{font-size:20px;margin-bottom:8px}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kinds button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:18px;background:#ffffff0d;border:1px solid var(--line2);text-align:left;font-weight:800;font-size:14px;min-height:92px}
.kinds button i{font-style:normal;font-size:28px}
.kinds button small{font-weight:500;font-size:11.5px;color:var(--muted)}
.kinds button.silent{border-color:#ffc22e88}
.cnt{height:6px;border-radius:4px;background:#ffffff1c;overflow:hidden;margin-top:6px}
.cnt i{display:block;height:100%;background:var(--red);width:100%;transition:width 6s linear}
.full{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:12px}
.full.red{background:radial-gradient(circle,#ff4d6d,#5a0018)}
.full.warn{background:radial-gradient(circle,#ff9a3d,#5a2600)}
.full.dark{background:#0b0b2a}
.full .big{font-size:76px;line-height:1}
.full h2{font-size:30px}
.toast{position:absolute;left:14px;right:14px;top:14px;z-index:50;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast div{background:#fff;color:var(--ink);font-weight:700;border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px #0008;animation:fi .2s;font-size:14px}
.login{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;gap:14px}
.login img{height:40px;align-self:flex-start}
.login h1{font-size:34px}
.login h1 span{color:var(--lime)}
.opl{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:300px;overflow-y:auto}
.opl button{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;border:1px solid var(--line2);text-align:left;font-size:12.5px;font-weight:700}
.opl button small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.opl button.on{border-color:var(--lime);background:#b4e32f18}
.opl .av{width:32px;height:32px;font-size:12px}
.cps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cps div{padding:14px 10px;border-radius:16px;text-align:center;background:#ffffff0a;border:1px solid var(--line)}
.cps div.ok{background:#b4e32f1f;border-color:#b4e32f66}
video.scan{width:100%;border-radius:16px;background:#000;max-height:260px;object-fit:cover}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.areas button{padding:12px 10px;border-radius:14px;border:1px solid var(--line2);font-size:13px;font-weight:700;text-align:left;display:flex;align-items:center;gap:8px}
.areas button.on{border-color:var(--lime);background:#b4e32f18}
</style>

<body>
<div class="phone" id="ph"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../mando.js?v=6"></script>
<script>
const M = Mando, E = M.esc;
// el operador entra con su usuario (código de empresa + celular + PIN); la empresa la fija su sesión
let OSES = M.Auth.currentOp();
M.useClient(OSES ? OSES.client : 'mixta');
let S = M.load();
const ph = document.getElementById('ph');
let meId = OSES ? OSES.opId : null;
const ui = { tab: 'inicio', order: null, chat: null, photo: null, sig: null, lastOrders: null, lastMsgs: S.msgs.length, scanStream: null, gpsErr: null, evacSeen: null };
const me = () => S.ops.find(p => p.id === meId);
const site = () => M.site(S, me().site);
const indoor = () => site().kind === 'indoor';
const grpN = id => (S.groups.find(g => g.id === id) || {}).name || '';
const stc = p => M.STATUS[p.status].c;
const avatar = p => `<span class="av" style="background:${stc(p)}">${E(p.ini)}</span>`;
const myOrders = () => S.orders.filter(o => o.opId === meId);
const openMine = () => myOrders().filter(o => !['completada', 'cancelada'].includes(o.status)).sort((a, b) => a.due - b.due);
const today = ts => new Date(ts).toDateString() === new Date().toDateString();
const myChats = () => [['consola', '🎧', 'Central', 'Mesa de control'], [me().group, '🏢', grpN(me().group), 'Tu departamento'], ...S.chats.filter(c => c.members.includes(meId)).map(c => [c.id, '👥', c.name, c.dept])];
const inChat = (m, id) => id === 'consola' ? ((m.from === meId && m.to === 'consola') || (m.from === 'consola' && m.to === meId) || m.to === 'all') : m.to === id;
const unreadIn = id => S.msgs.filter(m => m.kind !== 'voz' && m.from !== meId && inChat(m, id) && !m.reads.includes(meId)).length;
const unread = () => myChats().reduce((a, c) => a + unreadIn(c[0]), 0);
const here = () => { const p = me(), a = M.areaAt(S, p.site, p.x, p.y); return a ? a.name : indoor() ? 'Pasillo' : 'En calle'; };
function toast(t) { const box = ph.querySelector('.toast') || Object.assign(document.createElement('div'), { className: 'toast' }); ph.appendChild(box); const d = document.createElement('div'); d.textContent = t; box.appendChild(d); setTimeout(() => d.remove(), 3500); }
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// ---------- entrar ----------
function login() {
  const fmtN = v => { const d = v.replace(/\D/g, '').slice(0, 10); return [d.slice(0, 2), d.slice(2, 6), d.slice(6)].filter(Boolean).join(' '); };
  ph.innerHTML = `<div class="login"><div style="display:flex;align-items:center;justify-content:space-between"><img src="../../assets/navi-logo.png" alt="Navi"><button class="hb" id="lref" title="Refrescar la app" aria-label="Refrescar la app">⟳</button></div>
    <h1>NAVI <span>Mando</span></h1><p class="muted">La app de trabajo de tu empresa: órdenes, radio, chat por departamento y botón de emergencia. Solo para personal de empresas cliente de Navi.</p>
    <label class="muted" style="font-size:13px;font-weight:700">Código de empresa<input class="f" id="code" placeholder="NAVI-0000" autocapitalize="characters" autocomplete="organization" style="margin-top:6px"></label>
    <label class="muted" style="font-size:13px;font-weight:700">Tu celular Navi<input class="f" id="cel" inputmode="numeric" autocomplete="tel-national" placeholder="55 1234 5678" style="margin-top:6px"></label>
    <label class="muted" style="font-size:13px;font-weight:700">PIN<input class="f" id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••" style="margin-top:6px"></label>
    <p id="lerr" style="color:#FF9DB0;font-size:13px;min-height:18px;margin:-4px 0"></p>
    <button class="btn lime" id="go">Entrar</button>
    <p class="muted" style="font-size:12px;text-align:center">Tu empresa te da el código y tu PIN. Para entrar a otra empresa cierra sesión y usa sus datos.</p>
    <div style="border-top:1px dashed var(--line2);padding-top:12px">
      <div class="muted" style="font-size:12.5px;font-weight:700;margin-bottom:8px">Modo demostración · toca tu empresa y luego tu nombre:</div>
      <div class="chips" id="cls">${Object.entries(M.CLIENTS).map(([k, c]) => `<button data-cl="${k}">${c.icon} ${E(c.name)}</button>`).join('')}</div>
      <div class="opl" id="opl" style="margin-top:8px"></div>
    </div></div>`;
  const $l = id => document.getElementById(id);
  $l('lref').onclick = () => location.reload();
  $l('cel').oninput = () => { $l('cel').value = fmtN($l('cel').value); $l('lerr').textContent = ''; };
  ['code', 'pin'].forEach(id => $l(id).oninput = () => $l('lerr').textContent = '');
  $l('cls').onclick = e => {
    const b = e.target.closest('[data-cl]'); if (!b) return;
    const k = b.dataset.cl, c = M.CLIENTS[k];
    ph.querySelectorAll('#cls button').forEach(x => x.classList.toggle('on', x === b));
    $l('code').value = c.code;
    $l('opl').innerHTML = M.Auth.demoOps(k).map(p => `<button data-cel="${p.phone}"><span class="av" style="background:${stc(p)}">${E(p.ini)}</span><span>${E(p.name)}<small>${E(p.role)}</small></span></button>`).join('');
  };
  $l('opl').onclick = e => {
    const b = e.target.closest('[data-cel]'); if (!b) return;
    ph.querySelectorAll('#opl button').forEach(x => x.classList.toggle('on', x === b));
    $l('cel').value = fmtN(b.dataset.cel); $l('pin').value = M.Auth.OP_PIN; $l('lerr').textContent = '';
  };
  $l('go').onclick = () => {
    if (!$l('code').value.trim() || !$l('cel').value.trim() || !$l('pin').value) { $l('lerr').textContent = 'Escribe el código de empresa, tu celular y tu PIN.'; return; }
    const r = M.Auth.loginOp($l('code').value, $l('cel').value, $l('pin').value);
    if (r.err) { $l('lerr').textContent = r.err; return; }
    OSES = r.ok; M.useClient(OSES.client); S = M.load(); ui.lastMsgs = S.msgs.length;
    meId = OSES.opId; ui.tab = 'inicio'; ui.lastOrders = null;
    toast('¡Hola, ' + OSES.name.split(' ')[0] + '! · ' + M.CLIENTS[OSES.client].name.split(',')[0]);
    render(); if (me().shift) startGps();
  };
}

// ---------- GPS real (solo en la calle y solo durante el turno) ----------
let watch = null;
function startGps() {
  if (watch != null || !meId || indoor() || !navigator.geolocation) return;
  watch = navigator.geolocation.watchPosition(pos => {
    ui.gpsErr = null;
    const { latitude: la, longitude: lo, accuracy } = pos.coords, xy = M.fromLL(la, lo);
    M.update(s => {
      const p = s.ops.find(x => x.id === meId); if (!p || !p.shift) return;
      const prev = p.gps ? M.toLL(p.x, p.y) : null;
      if (prev) { const d = hav(prev, [la, lo]); if (d < 3) p.km = +(p.km + d).toFixed(3); }
      if (!p.gps) M.event(s, meId, 'Activó su GPS', 'estado');
      Object.assign(p, xy, { gps: Date.now(), acc: Math.round(accuracy), seen: Date.now(), target: null });

function heartbeat() { try { return +localStorage.getItem(M.hbKey()) || 0; } catch (e) { return 0; } }
let pend = false;
M.on(s => { S = s; if (pend) return; pend = true; queueMicrotask(() => { pend = false; if (!meId || !me()) return; notify(); const a = document.activeElement; if (a && a.id === 'mIn') { const m = document.getElementById('msgs'); if (m) { const tmp = document.createElement('div'); tmp.innerHTML = scrChat(); m.innerHTML = tmp.querySelector('#msgs').innerHTML; document.getElementById('scr').scrollTop = 1e6; markRead(); } return; } if (ui.drawing || ph.querySelector('.ov') || ph.querySelector('.ptt.on')) { checkPrompts(); return; } render(); }); });
setInterval(() => {
  if (!meId || !me()) return;
  if (Date.now() - heartbeat() > 7000) M.tick();
  M.update(s => { const p = s.ops.find(x => x.id === meId); if (p) p.seen = Date.now(); }, true);
}, 4000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render(); ui.lastOrders = meId && me() ? myOrders().filter(o => o.status === 'asignada').map(o => o.id) : null;
if (meId && me() && me().shift) startGps();
</script>
