<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NAVI Mando · Operador</title>
<meta name="theme-color" content="#08083F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../../assets/icon-192.png">
<link rel="apple-touch-icon" href="../../assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Navi Mando">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08083F;--card:#13136A;--line:#ffffff17;--line2:#ffffff26;--text:#F4F3FF;--muted:#B0AEE0;--lime:#B4E32F;--ink:#06062E;--purple:#7B5CFA;--red:#FF4D6D;--cyan:#7EE0FF;--yellow:#FFC22E;--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#02021c;color:var(--text);font:15px/1.45 var(--body);min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.1}
/* en escritorio se ve como un teléfono */
.phone{max-width:430px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);position:relative;display:flex;flex-direction:column}
@media (min-width:600px){body{padding:20px 0;background:radial-gradient(circle at 30% 20%,#1E1E8A,#02021c 60%)}.phone{min-height:860px;height:860px;border-radius:40px;border:10px solid #000;overflow:hidden;box-shadow:0 40px 90px #000a}}
.hd{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;padding-top:max(14px,env(safe-area-inset-top))}
.hd .who{flex:1;min-width:0}
.hd b{display:block;font-family:var(--display);font-size:17px}
.hd small{font-size:12px;color:var(--muted)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--ink);flex:none}
.stb{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:99px;padding:7px 12px;background:#ffffff12}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.scr{flex:1;overflow-y:auto;padding:4px 16px 110px}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:#06063Af2;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 6px max(8px,env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;position:relative}
.tabbar button i{font-style:normal;font-size:21px}
.tabbar button.on{color:var(--lime)}
.tabbar button em{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;font-style:normal;font-size:10px;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.sos{position:absolute;right:16px;bottom:86px;width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;font-family:var(--display);font-weight:800;font-size:16px;box-shadow:0 8px 24px #ff4d6d77;z-index:5;touch-action:none;user-select:none;-webkit-user-select:none}
.sos svg{position:absolute;inset:-5px;width:74px;height:74px;transform:rotate(-90deg)}
.sos circle{fill:none;stroke:#fff;stroke-width:4;stroke-dasharray:220;stroke-dashoffset:220}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card h3 small{margin-left:auto;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:16px;padding:14px;font-weight:800;font-size:15px;background:#ffffff12;border:1px solid var(--line2)}
.btn:active{transform:scale(.98)}
.btn.lime{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:12px;width:auto}
.row{display:flex;gap:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.stats small{display:block;font-size:11px;color:var(--muted)}
.stats b{font-family:var(--display);font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line2);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.chips button.on{background:#fff;color:var(--ink)}
.oc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.oc .h{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:4px}
.oc .h span:last-child{margin-left:auto}
.oc b{display:block;font-size:16px}
.oc small{display:block;color:var(--muted);font-size:13px}
.pill{font-size:11px;font-weight:800;border-radius:99px;padding:3px 9px;background:#ffffff14}
.pill.alta{background:#ff6fb133;color:#ffb3d6}.pill.new{background:var(--lime);color:var(--ink)}
.bar{height:6px;border-radius:4px;background:#ffffff14;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime)}
.steps{display:flex;gap:4px;margin:12px 0}
.steps i{flex:1;height:5px;border-radius:3px;background:#ffffff1c}
.steps i.on{background:var(--lime)}
.ck{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#ffffff08;margin-bottom:6px;font-size:14.5px;width:100%;text-align:left}
.ck span{width:24px;height:24px;border-radius:8px;border:2px solid var(--line2);display:grid;place-items:center;flex:none;font-size:14px}
.ck.on span{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.minimap{height:150px;border-radius:16px;background:#0A0A48 url(../../assets/mapa-cdmx.jpg) center/cover;position:relative;overflow:hidden;margin:10px 0}
.minimap::before{content:"";position:absolute;inset:0;background:#0A0A4888}
.minimap i{position:absolute;transform:translate(-50%,-100%);font-style:normal;font-size:28px}
.minimap .me{transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:var(--cyan);border:3px solid #fff;box-shadow:0 0 0 6px #7ee0ff44}
canvas.sig{width:100%;height:170px;background:#fff;border-radius:14px;touch-action:none;display:block}
.photo{width:100%;border-radius:14px;margin-top:8px;display:block}
.ptt{width:210px;height:210px;border-radius:50%;margin:24px auto 14px;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#d4f56b,var(--lime));color:var(--ink);font-family:var(--display);font-weight:800;font-size:20px;box-shadow:0 14px 0 #6f8f12,0 20px 50px #b4e32f55;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .08s,box-shadow .08s;text-align:center;line-height:1.2}
.ptt.on{background:radial-gradient(circle at 40% 30%,#ff8fa4,var(--red));color:#fff;transform:translateY(10px);box-shadow:0 4px 0 #9b1f36,0 0 0 18px #ff4d6d33}
.ptt small{display:block;font-family:var(--body);font-size:12px;font-weight:700;opacity:.75}
.vz{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:#ffffff0a;margin-bottom:6px;font-size:13px}
.vz button{width:36px;height:36px;border-radius:50%;background:var(--lime);color:var(--ink);flex:none}
.msgs{display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.bub{max-width:82%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:#ffffff14;font-size:14.5px}
.bub.me{align-self:flex-end;background:var(--purple);border-radius:16px 16px 4px 16px}
.bub.dif{align-self:center;background:#b4e32f1c;border:1px solid #b4e32f55;border-radius:16px;text-align:center;max-width:95%}
.bub small{display:block;font-size:11px;color:#ffffffaa;margin-top:2px}
.bub .w{font-size:11.5px;font-weight:800;color:var(--cyan);display:block}
.bub audio{height:34px;max-width:220px;display:block}
.comp{position:absolute;left:0;right:0;bottom:66px;display:flex;gap:8px;padding:8px 12px;background:var(--bg);border-top:1px solid var(--line)}
input.f,select.f,textarea.f{background:#ffffff0d;border:1px solid var(--line2);border-radius:14px;padding:12px 13px;width:100%;outline:none}
input.f:focus,textarea.f:focus{border-color:var(--lime)}
select.f option{background:#14146A}
.seg{display:flex;background:#ffffff0c;border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:#ffffff1c;color:#fff}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.li i{font-style:normal;font-size:22px}
.li span{flex:1}
.li small{display:block;color:var(--muted);font-size:12.5px}
.sw{width:46px;height:28px;border-radius:99px;background:#ffffff22;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--lime)}.sw.on::after{transform:translateX(18px)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--muted);margin:2px 0 10px}
.ov{position:absolute;inset:0;background:#02021ccc;z-index:30;display:flex;align-items:flex-end;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.sheet{background:#11115F;border-radius:26px 26px 0 0;padding:20px 18px max(20px,env(safe-area-inset-bottom));width:100%;max-height:88%;overflow-y:auto}
.sheet h3{font-size:20px;margin-bottom:8px}
.full{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:12px}
.full.red{background:radial-gradient(circle,#ff4d6d,#5a0018)}
.full.warn{background:radial-gradient(circle,#ff9a3d,#5a2600)}
.full .big{font-size:76px;line-height:1}
.full h2{font-size:30px}
.toast{position:absolute;left:14px;right:14px;top:14px;z-index:50;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast div{background:#fff;color:var(--ink);font-weight:700;border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px #0008;animation:fi .2s;font-size:14px}
.login{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;gap:14px}
.login img{height:40px;align-self:flex-start}
.login h1{font-size:34px}
.login h1 span{color:var(--lime)}
.opl{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:280px;overflow-y:auto}
.opl button{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;border:1px solid var(--line2);text-align:left;font-size:13px;font-weight:700}
.opl button.on{border-color:var(--lime);background:#b4e32f18}
.opl .av{width:32px;height:32px;font-size:12px}
.cps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cps div{padding:14px 10px;border-radius:16px;text-align:center;background:#ffffff0a;border:1px solid var(--line)}
.cps div.ok{background:#b4e32f1f;border-color:#b4e32f66}
video.scan{width:100%;border-radius:16px;background:#000;max-height:260px;object-fit:cover}
</style>
</head>
<body>
<div class="phone" id="ph"></div>
<script src="../mando.js?v=1"></script>
<script>
const M = Mando, E = M.esc;
let S = M.load();
const ph = document.getElementById('ph');
let meId = null; try { meId = localStorage.getItem('navi.mando.me'); } catch (e) {}
const ui = { tab: 'inicio', order: null, chat: 'consola', photo: null, lastOrders: null, lastMsgs: S.msgs.length, scanStream: null };
const me = () => S.ops.find(p => p.id === meId);
const grpN = id => (S.groups.find(g => g.id === id) || {}).name || '';
const stc = p => M.STATUS[p.status].c;
const avatar = p => `<span class="av" style="background:${stc(p)}">${E(p.ini)}</span>`;
const myOrders = () => S.orders.filter(o => o.opId === meId);
const openMine = () => myOrders().filter(o => !['completada', 'cancelada'].includes(o.status)).sort((a, b) => a.due - b.due);
const today = ts => new Date(ts).toDateString() === new Date().toDateString();
const unread = () => S.msgs.filter(m => m.from !== meId && (m.to === meId || m.to === 'all' || m.to === me().group) && !m.reads.includes(meId)).length;
function toast(t) { const box = ph.querySelector('.toast') || Object.assign(document.createElement('div'), { className: 'toast' }); ph.appendChild(box); const d = document.createElement('div'); d.textContent = t; box.appendChild(d); setTimeout(() => d.remove(), 3500); }
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// ---------- entrar ----------
function login() {
  let pick = null;
  ph.innerHTML = `<div class="login"><img src="../../assets/navi-logo.png" alt="Navi">
    <h1>NAVI <span>Mando</span></h1><p class="muted">La app de trabajo de tu empresa: órdenes, radio, chat y SOS en un solo lugar.</p>
    <label class="muted" style="font-size:13px;font-weight:700">Código de empresa<input class="f" id="code" placeholder="${E(S.code)}" autocapitalize="characters" style="margin-top:6px"></label>
    <div class="muted" style="font-size:13px;font-weight:700">¿Quién eres? <span style="font-weight:500">(demo)</span></div>
    <div class="opl">${S.ops.map(p => `<button data-p="${p.id}"><span class="av" style="background:${stc(p)}">${E(p.ini)}</span>${E(p.name)}</button>`).join('')}</div>
    <button class="btn lime" id="go">Entrar</button>
    <p class="muted" style="font-size:12px;text-align:center">Tu empresa te da el código. En la demo puedes dejarlo vacío.</p></div>`;
  ph.querySelector('.opl').onclick = e => { const b = e.target.closest('[data-p]'); if (!b) return; pick = b.dataset.p; ph.querySelectorAll('.opl button').forEach(x => x.classList.toggle('on', x === b)); };
  document.getElementById('go').onclick = () => {
    const c = document.getElementById('code').value.trim().toUpperCase();
    if (c && c !== S.code) return toast('Ese código no corresponde a ninguna empresa');
    if (!pick) return toast('Elige tu nombre');
    meId = pick; try { localStorage.setItem('navi.mando.me', meId); } catch (e) {}
    ui.lastOrders = null; render();
  };
}

// ---------- pantallas ----------
function scrInicio() {
  const p = me(), cur = openMine()[0], dif = S.msgs.filter(m => m.kind === 'difusion').slice(-1)[0];
  const doneT = myOrders().filter(o => o.status === 'completada' && today(o.done)).length;
  const pct = Math.min(100, p.gb / p.gbMax * 100);
  return `<div class="card" style="background:${p.shift ? 'linear-gradient(135deg,#1d1d8f,#13136A)' : 'linear-gradient(135deg,#7B5CFA,#4B32C9)'}">
      ${p.shift ? `<h3>🟢 Turno activo<small>desde ${M.fmtT(p.shift.at)}</small></h3><div class="chips" id="stc">${['disponible', 'pausa'].map(k => `<button data-st="${k}" class="${p.status === k ? 'on' : ''}"><i class="dot" style="background:${M.STATUS[k].c}"></i>${M.STATUS[k].t}</button>`).join('')}</div>`
        : `<h3>¡Hola, ${E(p.name.split(' ')[0])}!</h3><p class="muted" style="font-size:14px;margin-bottom:12px">Inicia tu turno para recibir órdenes y aparecer en el mapa de tu central.</p><button class="btn lime" data-a="shift">▶ Iniciar turno</button>`}
    </div>
    <div class="stats"><div><small>Hoy</small><b>${doneT}</b><small>órdenes</small></div><div><small>Recorrido</small><b>${p.km.toFixed(0)}</b><small>km</small></div><div><small>Batería</small><b>${p.bat}%</b><small>&nbsp;</small></div><div><small>Datos</small><b>${(p.gbMax - p.gb).toFixed(1)}</b><small>GB libres</small></div></div>
    ${cur ? `<div class="card"><h3>📋 Tu siguiente orden<small>${E(cur.folio)}</small></h3>${orderCard(cur)}${nextBtn(cur)}</div>` : `<div class="card"><h3>📋 Sin órdenes pendientes</h3><p class="muted" style="font-size:14px">Cuando tu central te asigne una, te llega aquí con aviso.</p></div>`}
    ${dif ? `<div class="card" style="border-color:#b4e32f55"><h3>📢 Aviso de tu empresa<small>${M.fmtT(dif.at)}</small></h3><p style="font-size:14px">${E(dif.txt)}</p></div>` : ''}
    <div class="card"><h3>📶 Tu línea Navi<small>${p.gb.toFixed(1)} de ${p.gbMax} GB</small></h3><div class="bar"><i style="width:${pct}%"></i></div><p class="muted" style="font-size:12.5px;margin-top:8px">La app consume muy pocos datos. Si te quedas sin datos, avisa a tu central para que recargue tu línea.</p></div>
    ${p.shift ? '<button class="btn" data-a="endshift" style="margin-top:4px">⏹ Terminar turno</button>' : ''}`;
}
function orderCard(o) {
  const left = Math.round((o.due - Date.now()) / M.MIN);
  return `<button class="oc" data-o="${o.id}" style="margin:0 0 10px;background:#ffffff08"><div class="h"><span>${E(o.folio)}</span>${o.status === 'asignada' ? '<span class="pill new">NUEVA</span>' : ''}<span class="pill ${o.prio}">${o.prio}</span><span>${['completada', 'cancelada'].includes(o.status) ? M.ORDER_ST[o.status] : left < 0 ? '⚠️ Vencida' : '⏱️ ' + left + ' min'}</span></div><b>${E(o.title)}</b><small>${E(o.client)}</small><small>📍 ${E(o.addr)}</small></button>`;
}
function nextBtn(o) {
  const n = { asignada: ['aceptada', '✓ Aceptar orden'], aceptada: ['encamino', '🚗 Voy en camino'], encamino: ['ensitio', '📍 Ya llegué'], ensitio: ['finish', '✅ Terminar trabajo'] }[o.status];
  return n ? `<button class="btn lime" data-next="${o.id}" data-to="${n[0]}">${n[1]}</button>` : '';
}
function scrOrdenes() {
  if (ui.order) return scrOrden();
  const op = openMine(), dn = myOrders().filter(o => o.status === 'completada' && today(o.done)).sort((a, b) => b.done - a.done);
  return `<h2 style="font-size:24px;margin:4px 0 12px">Mis órdenes</h2>
    ${op.map(orderCard).join('') || '<div class="card muted" style="text-align:center">Sin órdenes pendientes 🎉</div>'}
    ${dn.length ? `<h3 style="font-size:15px;margin:18px 0 10px" class="muted">Completadas hoy · ${dn.length}</h3>${dn.map(orderCard).join('')}` : ''}`;
}
function scrOrden() {
  const o = S.orders.find(x => x.id === ui.order); if (!o) { ui.order = null; return scrOrdenes(); }
  const p = me(), idx = ['asignada', 'aceptada', 'encamino', 'ensitio', 'completada'].indexOf(o.status), open = !['completada', 'cancelada'].includes(o.status);
  return `<button class="back" data-a="back">← Mis órdenes</button>
    <div class="h muted" style="font-size:12.5px">${E(o.folio)} · ${M.ORDER_ST[o.status]}</div>
    <h2 style="font-size:24px;margin:4px 0">${E(o.title)}</h2>
    <div class="steps">${[0, 1, 2, 3, 4].map(i => `<i class="${i <= idx ? 'on' : ''}"></i>`).join('')}</div>
    <div class="card"><b style="font-size:16px">${E(o.client)}</b><div class="muted" style="font-size:14px">📍 ${E(o.addr)}</div>
      <div class="minimap"><i style="left:${o.x}%;top:${o.y}%">📍</i><span class="me" style="position:absolute;left:${p.x}%;top:${p.y}%"></span></div>
      <div class="row"><a class="btn sm" style="flex:1" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.addr + ', CDMX')}">🧭 Cómo llegar</a><button class="btn sm" style="flex:1" data-a="chatc">💬 Central</button></div>
      ${o.notes ? `<p style="font-size:13.5px;margin-top:10px;background:#ffffff0a;border-radius:12px;padding:10px">📝 ${E(o.notes)}</p>` : ''}</div>
    ${o.status === 'ensitio' || o.status === 'completada' ? `<div class="card"><h3>Checklist<small>${o.checklist.filter(c => c.done).length}/${o.checklist.length}</small></h3>
      ${o.checklist.map((c, i) => `<button class="ck ${c.done ? 'on' : ''}" data-ck="${i}" ${open ? '' : 'disabled'}><span>${c.done ? '✓' : ''}</span>${E(c.t)}</button>`).join('')}</div>

function photoIn(file) {

function initSig(clear) {

  const r = c.getBoundingClientRect(); c.width = r.width * 2; c.height = r.height * 2;
  const x = c.getContext('2d'); x.scale(2, 2); x.lineWidth = 2.4; x.lineCap = 'round'; x.strokeStyle = '#06062E';

  else { x.fillStyle = '#9a98c4'; x.font = '13px DM Sans'; x.fillText('Firma aquí', 12, 22); }
  if (clear) return;
  let d = false; const pt = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { if (!c._drawn) { x.clearRect(0, 0, c.width, c.height); } d = true; ui.drawing = true; c._drawn = true; c.setPointerCapture(e.pointerId); x.beginPath(); x.moveTo(...pt(e)); };

  const ov = sheet(`<h3>Escanear punto</h3><video class="scan" id="vid" playsinline muted hidden></video><p class="muted" id="scanTxt" style="font-size:13px;margin:8px 0">Apunta al código QR del punto o acerca el celular a la etiqueta NFC.</p>

}
function fire() {
  vib([200, 100, 200, 100, 400]);
  M.update(s => { const p = s.ops.find(x => x.id === meId); p.status = 'sos'; if (!p.shift) p.shift = { at: Date.now() }; M.alert(s, 'sos', meId, 'Presionó el botón SOS'); M.event(s, meId, 'Envió SOS', 'alerta'); });
  render();
}
// pantallas que se imponen: SOS activo y verificación de trabajo solo
function checkPrompts() {
  const p = me(); if (!p) return;
  ph.querySelectorAll('.full').forEach(x => x.remove());
  const a = S.alerts.find(x => x.type === 'sos' && x.opId === meId && x.status !== 'cerrada');
  if (a) {
    const d = document.createElement('div'); d.className = 'full red';
    d.innerHTML = `<div class="big">🆘</div><h2>SOS enviado</h2><p style="font-size:16px">${a.status === 'atendida' ? '<b>Tu central ya está atendiendo.</b> Mantente donde estás si es seguro.' : 'Tu central recibió tu ubicación y te va a contactar.'}</p>
      <a class="btn" href="tel:911" style="background:#fff;color:#5a0018;max-width:300px">📞 Llamar al 911</a><button class="btn" id="ok" style="max-width:300px">Estoy bien, cancelar</button>`;
    ph.appendChild(d);
    d.querySelector('#ok').onclick = () => { M.update(s => { const x = s.alerts.find(q => q.id === a.id); x.status = 'cerrada'; x.note = 'Cancelada por el operador: está bien'; x.closed = Date.now(); s.ops.find(q => q.id === meId).status = 'disponible'; M.event(s, meId, 'Canceló el SOS: está bien', 'alerta'); }); render(); };
    return;
  }
  if (p.solo && p.soloAsk) {
    const d = document.createElement('div'); d.className = 'full warn';
    const left = Math.max(0, 45 - Math.round((Date.now() - p.soloAsk) / 1000));
    d.innerHTML = `<div class="big">🧍</div><h2>¿Estás bien?</h2><p style="font-size:16px">Modo trabajo solo. Si no respondes en ${left} s avisamos a tu central.</p><button class="btn lime" id="ok" style="max-width:300px;font-size:18px;padding:18px">Sí, estoy bien</button>`;
    ph.appendChild(d); vib(150);
    d.querySelector('#ok').onclick = () => { M.update(s => { const q = s.ops.find(x => x.id === meId); q.soloAsk = null; q.soloOk = Date.now(); }); render(); };
  }
}
// avisos de lo que llega de la central
function notify() {
  const p = me(); if (!p) return;
  const as = myOrders().filter(o => o.status === 'asignada').map(o => o.id);
  if (ui.lastOrders) as.filter(id => !ui.lastOrders.includes(id)).forEach(id => { const o = S.orders.find(x => x.id === id); toast('📋 Nueva orden: ' + o.title + ' · ' + o.client); vib([120, 60, 120]); M.beep(); });
  ui.lastOrders = as;
  S.msgs.slice(ui.lastMsgs).filter(m => m.from !== meId && (m.to === meId || m.to === 'all' || m.to === p.group || (m.to === 'consola' && false))).forEach(m => {
    if (m.kind === 'voz') { toast('🎙️ ' + (m.from === 'consola' ? 'Central' : 'Compañero') + ' habló por radio'); if (m.audio) play(m.id); }
    else if (!(ui.tab === 'chat')) { toast('💬 ' + (m.from === 'consola' ? 'Central' : (S.ops.find(x => x.id === m.from) || {}).name) + ': ' + m.txt); vib(60); }
  });
  ui.lastMsgs = S.msgs.length;
}
// si la consola no está abierta, la app mueve la simulación sola
function heartbeat() { try { return +localStorage.getItem('navi.mando.hb') || 0; } catch (e) { return 0; } }
let pend = false;
M.on(s => { S = s; if (pend) return; pend = true; queueMicrotask(() => { pend = false; if (!meId) return; notify(); const a = document.activeElement; if (a && a.id === 'mIn') { const m = document.getElementById('msgs'); if (m) { const tmp = document.createElement('div'); tmp.innerHTML = scrChat(); m.innerHTML = tmp.querySelector('#msgs').innerHTML; document.getElementById('scr').scrollTop = 1e6; markRead(); } return; } if (ui.drawing || ph.querySelector('.ov') || ph.querySelector('.ptt.on')) { checkPrompts(); return; } render(); }); });
setInterval(() => {
  if (meId && me() && Date.now() - heartbeat() > 7000) M.tick();
  if (meId && me()) { M.update(s => { const p = s.ops.find(x => x.id === meId); if (p) p.seen = Date.now(); }); }
}, 4000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render(); ui.lastOrders = meId && me() ? myOrders().filter(o => o.status === 'asignada').map(o => o.id) : null;
</script>
