<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Navi Móvil · Muy pronto</title>
<meta name="theme-color" content="#0B0B4F">
<link rel="icon" href="demo/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(circle at 50% 120%,#7B5CFA55,transparent 60%),#0B0B4F;color:#F4F3FF;font-family:"DM Sans",system-ui,sans-serif;text-align:center}
main{max-width:520px}
img{height:64px;width:auto;margin:0 auto 28px;display:block}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(40px,9vw,72px);line-height:1;letter-spacing:-.02em;margin-bottom:16px}
h1 em{font-style:normal;color:#B4E32F}
p{color:#B9B7E6;font-size:17px;line-height:1.5}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#B4E32F;margin-right:8px;animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 #B4E32F99}100%{box-shadow:0 0 0 14px #B4E32F00}}
small{display:block;margin-top:32px;color:#B9B7E6;font-size:13px}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<main>
  <img src="demo/assets/navi-logo.png" alt="Navi">
  <h1>Muy <em>pronto</em></h1>
  <p><span class="dot"></span>Estamos preparando la nueva telefonía móvil para toda la familia.</p>
  <small>© 2026 Navi Móvil</small>
</main>
</body>
</html>
