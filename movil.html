<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consumo · Navi Móvil</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0B4F">
<link rel="icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="navi.css">
<link rel="stylesheet" href="suite.css">
<script src="auth.js"></script>
<script>if (!NaviAuth.current()) location.replace('login.html?next=movil.html');</script>
<style>
.lines{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.lines[hidden]{display:none}
.lines button{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:99px;border:2px solid #ffffff25;font-weight:700;font-size:14px;transition:all .2s}
.lines button img{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:var(--lav)}
.lines button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.card{position:relative;background:var(--navy-2);border:1px solid #ffffff18;border-radius:var(--radius);padding:24px}
.card h2{font-size:18px;margin-bottom:4px}
.muted{color:var(--muted);font-size:14px}
/* ciclo */
.cycle{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.cycle .track{flex:1;min-width:200px;height:10px;border-radius:99px;background:#ffffff18;overflow:hidden}
.cycle .track i{display:block;height:100%;border-radius:99px;background:#fff}
.cycle b{font-family:var(--display);font-size:20px}
/* resumen */
.sum{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.data{background:var(--lime);color:var(--ink);border:0;box-shadow:8px 8px 0 var(--purple)}
.data .big{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;margin:12px 0 2px}
.data .big small{font-size:18px;font-weight:600}
.data .meter{height:14px;border-radius:99px;background:#06062e22;overflow:hidden;margin:14px 0 8px}
.data .meter i{display:block;height:100%;border-radius:99px;background:var(--ink);width:0;transition:width 1.1s cubic-bezier(.2,1,.3,1)}
.data .row{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.data .note{margin-top:12px;font-size:13px;background:#06062e14;border-radius:12px;padding:8px 10px}
.stat .ico{font-size:24px;margin-bottom:8px}
.stat .v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin-top:8px}
.stat .v small{font-size:14px;color:var(--muted);font-weight:500}
.stat .tag{display:inline-block;margin-top:8px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:#b4e32f26;color:var(--lime)}
/* gráfica diaria */
.chart-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chart{position:relative;height:200px;display:flex;align-items:flex-end;gap:4px;padding-left:56px;border-bottom:1px solid #ffffff30}
.chart .gl{position:absolute;left:56px;right:0;border-top:1px dashed #ffffff18;font-size:11px;color:var(--muted)}
.chart .gl span{position:absolute;left:-56px;top:-8px;width:50px;text-align:right}
.chart .bar{flex:1;position:relative;height:100%;display:flex;align-items:flex-end;cursor:pointer}
.chart .bar i{display:block;width:100%;background:var(--lime);border-radius:4px 4px 0 0;min-height:2px;transition:height .8s cubic-bezier(.2,1,.3,1),opacity .2s}
.chart:hover .bar i{opacity:.45}
.chart .bar:hover i,.chart .bar:focus i{opacity:1}
.chart .bar.today i{background:repeating-linear-gradient(135deg,var(--lime) 0 4px,var(--lime-2) 4px 8px)}
.xl{display:flex;justify-content:space-between;padding-left:56px;margin-top:6px;font-size:11px;color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:#fff;color:var(--ink);font-size:13px;padding:8px 10px;border-radius:12px;box-shadow:0 10px 24px #0006;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .15s;z-index:3}
.tip b{display:block;font-size:15px}
/* detalle */
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}
.tabs{display:flex;gap:6px;background:#ffffff10;padding:5px;border-radius:99px;margin:12px 0 10px;width:max-content;max-width:100%}
.tabs button{padding:8px 16px;border-radius:99px;font-weight:700;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--lime);color:var(--ink)}
.rows{max-height:360px;overflow:auto}
.r{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;border-top:1px solid #ffffff12;font-size:14px}
.r:first-child{border-top:0}
.r span{color:var(--muted);font-size:13px}
.r b{white-space:nowrap}
/* equipo */
.dev .hd{display:flex;gap:14px;align-items:center;margin:12px 0 14px}
.dev .idok{display:inline-block;margin:10px 0 14px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:#b4e32f26;color:var(--lime)}
.dev .credit{margin-top:14px;font-size:11px;color:var(--muted)}
.dev .credit a{text-decoration:underline}
#idcard .idpic svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.8) translateY(8px);opacity:0}}
.dev .hd b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{text-align:right;font-weight:700}
.imei{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.imei button{font-size:12px;color:var(--lime);font-weight:700}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
@media (max-width:980px){.sum{grid-template-columns:1fr 1fr}.data{grid-column:1/-1}.split{grid-template-columns:1fr}}
@media (max-width:520px){.sum{grid-template-columns:1fr}.data .big{font-size:38px}.chart{gap:2px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html"><img src="assets/navi-logo.png" alt="Navi"><small>MÓVIL</small></a>
    <a class="btn btn-ghost sm back" href="cuenta.html">← <span>Mi Navi</span></a>
  </div>
</header>

<main class="wrap">
  <div class="title">
    <div class="ico" style="background:var(--lime)">📶</div>
    <div><h1>Consumo</h1><p id="sub"></p></div>
  </div>

  <div class="lines" id="lines"></div>
  <div id="idcard" style="margin:4px 0 22px"></div>

  <section class="card cycle" style="margin-bottom:16px">
    <div><span class="muted">Ciclo actual</span><br><b id="cycleTxt"></b></div>
    <div class="track" aria-hidden="true"><i id="cycleBar"></i></div>
    <div style="text-align:right"><b id="daysLeft"></b><br><span class="muted" id="renew"></span></div>
  </section>

  <section class="sum">
    <div class="card data">
      <h2>Datos de alta velocidad</h2>
      <div class="big" id="dLeft"></div>
      <div class="meter" role="progressbar" id="dMeterWrap" aria-valuemin="0"><i id="dMeter"></i></div>
      <div class="row"><span id="dUsed"></span><span id="dPlan"></span></div>
      <div class="note" id="dNote"></div>
    </div>
    <div class="card stat"><div class="ico">📞</div><h2>Llamadas</h2><div class="v" id="calls"></div><span class="tag">Ilimitadas</span></div>
    <div class="card stat"><div class="ico">💬</div><h2>Mensajes</h2><div class="v" id="sms"></div><span class="tag">Ilimitados</span></div>
    <div class="card stat"><div class="ico">📲</div><h2>Redes sociales</h2><div class="v" id="social"></div><span class="tag">No consume tus datos</span></div>
  </section>

  <section class="card">
    <div class="chart-h">
      <div><h2>Datos por día</h2><span class="muted">Este ciclo · pasa el cursor sobre una barra</span></div>
      <span class="muted" id="avg"></span>
    </div>
    <div class="chart" id="chart" role="img"></div>
    <div class="xl" id="xl"></div>
    <div class="tip" id="tip"></div>
  </section>

  <section class="split">
    <div class="card">
      <h2>Detalle de uso</h2>
      <div class="tabs" role="tablist">
        <button role="tab" data-t="datos" aria-selected="true">Datos</button>
        <button role="tab" data-t="llamadas" aria-selected="false">Llamadas</button>
        <button role="tab" data-t="mensajes" aria-selected="false">Mensajes</button>
      </div>
      <div class="rows" id="rows"></div>
    </div>
    <div class="card dev">
      <h2>Equipo de esta línea</h2>
      <span class="idok">✓ Identificado por IMEI</span>
      <dl class="kv" id="devKv"></dl>      <div class="acts">
        <a class="btn btn-lime sm" id="topupBtn" href="recargas.html">⚡ Recargar</a>
      </div>
    </div>
  </section>
</main>

<script>
const user = NaviAuth.current();
if (user) {
  const $ = id => document.getElementById(id);
  const lines = accountLines(user);
  const fam = user.plan.type === 'familia';
  let sel = Math.max(0, Math.min(lines.length - 1, +(location.hash.match(/^#l(\d)$/) || [, 1])[1] - 1)), tab = 'datos';

  // ciclo de facturación: del día 15 al 14 del mes siguiente
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(today.getFullYear(), today.getMonth() - (today.getDate() < 15 ? 1 : 0), 15);
  const end = new Date(start.getFullYear(), start.getMonth() + 1, 14);
  const DAY = 864e5, total = Math.round((end - start) / DAY) + 1, day = Math.round((today - start) / DAY) + 1;
  const d = (x, o = { day: 'numeric', month: 'short' }) => x.toLocaleDateString('es-MX', o);
  $('cycleTxt').textContent = `${d(start)} – ${d(end)}`;
  $('cycleBar').style.width = (day / total * 100) + '%';
  $('daysLeft').textContent = `Quedan ${total - day} días`;
  $('renew').textContent = `Se renueva el ${d(new Date(+end + DAY), { day: 'numeric', month: 'long' })}`;
  $('sub').textContent = fam ? `Plan Familia · ${lines.length} líneas` : `Plan ${user.plan.gb} GB · ${fmtPhone(user.phone)}`;

  // números de demostración, siempre iguales para la misma línea
  const rng = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const usage = i => {
    const L = lines[i], r = rng(+L.phone.slice(-6) + 7);
    const usedGB = L.gb * DEMO_USED[i];
    const w = Array.from({ length: day }, (_, k) => {
      const wd = new Date(+start + k * DAY).getDay();
      return (0.4 + r() * 1.2) * (wd === 0 || wd === 6 ? 1.5 : 1);
    });
    const sw = w.reduce((a, b) => a + b, 0);
    const daily = w.map(x => x / sw * usedGB);
    // el registro de la red solo trae números (no los nombres del directorio del celular)
    const contacts = Array.from({ length: 5 }, () => String(5500000000 + Math.floor(r() * 99999999)).padStart(10, '0'));
    const calls = Array.from({ length: 9 }, (_, k) => ({
      who: fmtPhone(contacts[Math.floor(r() * contacts.length)]),
      dir: r() > .5 ? 'Saliente' : 'Entrante', min: 1 + Math.floor(r() * 24), ago: k * 2 + Math.floor(r() * 2),
    }));
    return { L, usedGB, daily, calls, mins: 120 + Math.floor(r() * 380), sms: 30 + Math.floor(r() * 160), social: usedGB * (0.25 + r() * .2) };
  };
  const gb = n => n >= 1 ? n.toFixed(1) + ' GB' : Math.round(n * 1024) + ' MB';

  const render = () => {
    const u = usage(sel), L = u.L, extra = Topups.extra(L.phone), totalGB = L.gb + extra;
    const left = totalGB - u.usedGB, pct = u.usedGB / totalGB;
    $('topupBtn').href = `recargas.html#l${sel + 1}`;
    $('lines').hidden = !fam;
    $('lines').innerHTML = lines.map((l, i) => `<button data-i="${i}" aria-pressed="${i === sel}"><img src="assets/${l.img}.png" alt="">${l.name}</button>`).join('');

    $('dLeft').innerHTML = `${left.toFixed(1)} GB <small>disponibles</small>`;
    $('dMeterWrap').setAttribute('aria-valuemax', totalGB); $('dMeterWrap').setAttribute('aria-valuenow', u.usedGB.toFixed(1));
    $('dMeter').style.width = '0'; requestAnimationFrame(() => setTimeout(() => $('dMeter').style.width = pct * 100 + '%', 30));
    $('dUsed').textContent = `${gb(u.usedGB)} usados`;
    $('dPlan').textContent = extra ? `de ${totalGB} GB (+${extra} GB recarga)` : `de ${L.gb} GB`;
    const perDay = left / Math.max(1, total - day);
    $('dNote').innerHTML = pct > .8
      ? `⚠️ Vas en ${Math.round(pct * 100)}%. Al terminar tus GB sigues navegando a velocidad reducida. <a href="recargas.html#l${sel + 1}" style="text-decoration:underline;font-weight:800">Recarga aquí →</a>`
      : `Te alcanza para ${gb(perDay)} por día hasta tu renovación.`;
    $('calls').innerHTML = `${u.mins} <small>min</small>`;
    $('sms').innerHTML = `${u.sms} <small>SMS</small>`;
    $('social').innerHTML = `${gb(u.social)} <small>usados</small>`;

    // barras por día (una sola serie, eje en GB)
    const max = Math.max(...u.daily), top = Math.ceil(max * 4) / 4 || .25;
    const grid = [0.5, 1].map(f => `<div class="gl" style="bottom:${f * 100}%"><span>${gb(top * f).replace(' ', '&nbsp;')}</span></div>`).join('');
    $('chart').innerHTML = grid + u.daily.map((v, k) => `<div class="bar${k === day - 1 ? ' today' : ''}" tabindex="0" data-k="${k}" aria-label="${d(new Date(+start + k * DAY))}: ${gb(v)}"><i style="height:0"></i></div>`).join('');
    $('chart').setAttribute('aria-label', `Datos por día, ${day} días, promedio ${gb(u.usedGB / day)}`);
    requestAnimationFrame(() => setTimeout(() => document.querySelectorAll('#chart .bar i').forEach((i, k) => i.style.height = (u.daily[k] / top * 100) + '%'), 30));
    $('xl').innerHTML = `<span>${d(start)}</span><span>Hoy</span>`;
    $('avg').textContent = `Promedio ${gb(u.usedGB / day)} al día`;
    $('chart').dataset.sel = sel;

    // detalle
    const rows = {
      datos: u.daily.map((v, k) => [d(new Date(+start + k * DAY), { weekday: 'short', day: 'numeric', month: 'short' }), gb(v)]).reverse(),
      llamadas: u.calls.map(c => [`${c.who}<br><span>${c.dir} · hace ${!c.ago ? 'unas horas' : c.ago === 1 ? '1 día' : c.ago + ' días'}</span>`, `${c.min} min`]),
      mensajes: u.daily.map((v, k) => [d(new Date(+start + k * DAY), { weekday: 'short', day: 'numeric', month: 'short' }), `${Math.max(1, Math.round(v * 12))} SMS`]).reverse(),
    }[tab];
    $('rows').innerHTML = rows.map(([a, b]) => `<div class="r"><div>${a}</div><b>${b}</b></div>`).join('');

    // equipo
    const D = L.device;
    $('idcard').innerHTML = lineCard(user, L);    $('devKv').innerHTML = `
      <dt>IMEI</dt><dd class="imei"><span id="imeiTxt">${maskImei(D.imei)}</span><button id="imeiBtn">Mostrar</button></dd>
      <dt>Marca</dt><dd>${D.brand}</dd><dt>Modelo</dt><dd>${D.model}</dd>
      <dt>Almacenamiento</dt><dd>${D.storage}</dd><dt>Color</dt><dd>${D.color}</dd>
      <dt>Sistema</dt><dd>${D.os}</dd><dt>SIM</dt><dd>${D.sim}</dd>
      <dt>Red</dt><dd>${D.red}${D.volte ? ' · VoLTE' : ''}</dd>`;
    $('imeiBtn').onclick = () => {
      const show = $('imeiBtn').textContent === 'Mostrar';
      $('imeiTxt').textContent = show ? fmtImei(D.imei) : maskImei(D.imei);
      $('imeiBtn').textContent = show ? 'Ocultar' : 'Mostrar';
    };
    window.__u = u;
  };

  $('lines').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { sel = +b.dataset.i; render(); } });
  document.querySelector('.tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    tab = b.dataset.t; document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b)); render();
  });

  // tooltip de las barras
  const tip = $('tip'), chartCard = $('chart').parentElement;
  const showTip = bar => {
    const k = +bar.dataset.k, v = window.__u.daily[k];
    tip.innerHTML = `<b>${gb(v)}</b>${d(new Date(+start + k * DAY), { weekday: 'long', day: 'numeric', month: 'short' })}`;
    const br = bar.querySelector('i').getBoundingClientRect(), cr = chartCard.getBoundingClientRect();
    const x = Math.min(Math.max(br.left + br.width / 2 - cr.left, 70), cr.width - 70);
    tip.style.left = x + 'px'; tip.style.top = (br.top - cr.top - 6) + 'px';
    tip.style.opacity = 1;
  };
  $('chart').addEventListener('mouseover', e => { const b = e.target.closest('.bar'); if (b) showTip(b); });
  $('chart').addEventListener('focusin', e => { const b = e.target.closest('.bar'); if (b) showTip(b); });
  $('chart').addEventListener('mouseleave', () => tip.style.opacity = 0);
  $('chart').addEventListener('focusout', () => tip.style.opacity = 0);

  render();
}
</script>
</body>
</html>
